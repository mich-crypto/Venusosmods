<title>JK BMS Setup Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar, step rail on the left (strip on phones), one step at a time in the main column.
   Dark first, like the Venus OS web page this prototype belongs to. */
:root {
  --bg:#0c0e0f; --surface:#14171a; --surface-2:#1b1f23; --ink:#eef1f2; --muted:#9aa3a9; --faint:#6a747b; --line:#272c30;
  --charge:#5aa9ff; --charge-soft:rgba(90,169,255,.14); --dis:#ff9a3d; --dis-soft:rgba(255,154,61,.14);
  --ok:#3ccf6e; --ok-soft:rgba(60,207,110,.13); --warn:#ffb020; --warn-soft:rgba(255,176,32,.13); --bad:#ff5a4e; --bad-soft:rgba(255,90,78,.14);
  --top:#c08cff; --top-soft:rgba(192,140,255,.15);
  --display:"Barlow Condensed","DIN Alternate","Bahnschrift","Arial Narrow",sans-serif;
  --body:"Barlow","D-DIN","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#f4f5f5; --surface:#ffffff; --surface-2:#eef0f1; --ink:#121517; --muted:#59636a; --faint:#8a939a; --line:#d8dcdf;
  --charge:#0b6bd3; --charge-soft:rgba(11,107,211,.10); --dis:#cf5f05; --dis-soft:rgba(207,95,5,.10);
  --ok:#17904a; --ok-soft:rgba(23,144,74,.10); --warn:#a86b00; --warn-soft:rgba(200,130,0,.12); --bad:#cc3127; --bad-soft:rgba(204,49,39,.10);
  --top:#7a3fd0; --top-soft:rgba(122,63,208,.10); color-scheme: light; } }
:root[data-theme="light"] {
  --bg:#f4f5f5; --surface:#ffffff; --surface-2:#eef0f1; --ink:#121517; --muted:#59636a; --faint:#8a939a; --line:#d8dcdf;
  --charge:#0b6bd3; --charge-soft:rgba(11,107,211,.10); --dis:#cf5f05; --dis-soft:rgba(207,95,5,.10);
  --ok:#17904a; --ok-soft:rgba(23,144,74,.10); --warn:#a86b00; --warn-soft:rgba(200,130,0,.12); --bad:#cc3127; --bad-soft:rgba(204,49,39,.10);
  --top:#7a3fd0; --top-soft:rgba(122,63,208,.10); color-scheme: light; }

* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
code, .mono { font-family:var(--mono); font-size:.78rem; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--charge); outline-offset:2px; }

.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:6; background:var(--bg); border-bottom:1px solid var(--line);
  padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.brand { display:flex; flex-direction:column; min-width:0; }
.brand b { font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:.06em; text-transform:uppercase; line-height:1.1; }
.brand span { color:var(--faint); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
.top .spacer { flex:1; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; padding:3px 10px; border-radius:99px; border:1px solid var(--line);
  color:var(--muted); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; background:none; }
button.chip { cursor:pointer; }
.chip.ok { color:var(--ok); border-color:var(--ok); } .chip.warn { color:var(--warn); border-color:var(--warn); } .chip.bad { color:var(--bad); border-color:var(--bad); }
.chip.on { color:var(--charge); border-color:var(--charge); }

.layout { display:grid; grid-template-columns:230px minmax(0,1fr); gap:28px; max-width:1180px; margin:0 auto;
  padding-block:20px 80px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
#rail { position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); align-self:start; display:flex; flex-direction:column; gap:2px; }
.rail-h { font-family:var(--display); font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin:14px 0 6px 10px; }
.rail-h:first-child { margin-top:0; }
.step-btn { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; text-align:left; padding:7px 10px; border:0; background:none;
  border-radius:4px; cursor:pointer; color:var(--muted); }
.step-btn:hover { background:var(--surface); color:var(--ink); }
.step-btn[aria-current="page"] { background:var(--surface-2); color:var(--ink); }
.step-btn .n { font-family:var(--display); font-weight:600; font-size:.85rem; color:var(--faint); text-align:center; }
.step-btn[aria-current="page"] .n { color:var(--charge); }
.step-btn .lbl { font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dot { width:8px; height:8px; border-radius:50%; background:transparent; }
.dot.changed { background:var(--charge); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }

@media (max-width: 900px) {
  .layout { grid-template-columns:minmax(0,1fr); gap:14px; padding-top:10px; }
  #rail { position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:6px; scrollbar-width:thin; }
  .rail-h { display:none; }
  .step-btn { grid-template-columns:auto auto auto; flex:0 0 auto; border:1px solid var(--line); }
}

main { min-width:0; }
.eyebrow { font-family:var(--display); font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--charge); }
h1 { font-family:var(--display); font-weight:600; font-size:2.1rem; line-height:1.05; margin:4px 0 8px; text-wrap:balance; letter-spacing:.01em; }
h2 { font-family:var(--display); font-weight:600; font-size:.82rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:30px 0 10px; }
h3 { font-family:var(--display); font-weight:600; font-size:1.15rem; margin:0 0 4px; letter-spacing:.02em; }
.lead { color:var(--muted); max-width:66ch; margin:0 0 18px; font-size:1rem; }
p { max-width:68ch; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 18px; min-width:0; }
.stack { display:flex; flex-direction:column; gap:12px; }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr)); gap:12px; }
.viz-card { padding:14px 14px 10px; }
.viz { width:100%; height:auto; display:block; overflow:visible; }
.viz-cap { color:var(--muted); font-size:.88rem; margin:6px 2px 0; min-height:1.4em; font-variant-numeric:tabular-nums; }
.viz-cap b { color:var(--ink); font-weight:600; }

/* svg tokens */
.viz text { font-family:var(--body); font-size:12px; fill:var(--muted); }
.viz .t-strong { fill:var(--ink); font-weight:600; font-size:13px; }
.viz .t-small { font-size:10.5px; fill:var(--faint); }
.viz .t-charge { fill:var(--charge); font-weight:600; } .viz .t-dis { fill:var(--dis); font-weight:600; }
.viz .t-ok { fill:var(--ok); font-weight:600; } .viz .t-warn { fill:var(--warn); font-weight:600; } .viz .t-bad { fill:var(--bad); font-weight:600; } .viz .t-top { fill:var(--top); font-weight:600; }
.viz .box { fill:var(--surface-2); stroke:var(--line); stroke-width:1.2; }
.viz .box.dashed { fill:none; stroke-dasharray:5 4; stroke:var(--faint); }
.viz .grid { stroke:var(--line); stroke-width:1; fill:none; }
.viz .axis { stroke:var(--faint); stroke-width:1; fill:none; }
.viz .link-line { stroke:var(--charge); stroke-width:1.5; stroke-dasharray:3 5; fill:none; opacity:.7; }
.viz .link-line.off { stroke:var(--faint); }
.viz .pk-req { fill:var(--charge); } .viz .pk-res { fill:var(--ok); }
.viz .l-charge { stroke:var(--charge); stroke-width:2.2; fill:none; } .viz .a-charge { fill:var(--charge-soft); stroke:none; }
.viz .l-dis { stroke:var(--dis); stroke-width:2.2; fill:none; } .viz .a-dis { fill:var(--dis-soft); stroke:none; }
.viz .l-ink { stroke:var(--ink); stroke-width:1.6; fill:none; } .viz .l-muted { stroke:var(--faint); stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
.viz .l-ok { stroke:var(--ok); stroke-width:2.2; fill:none; } .viz .l-bad { stroke:var(--bad); stroke-width:2.2; fill:none; } .viz .l-top { stroke:var(--top); stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
.viz .l-warn { stroke:var(--warn); stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
.viz .playhead { stroke:var(--ink); stroke-width:1; opacity:.55; }
.viz .f-ink { fill:var(--ink); } .viz .f-charge { fill:var(--charge); } .viz .f-dis { fill:var(--dis); } .viz .f-surface { fill:var(--surface); stroke:var(--ink); stroke-width:1.5; }
.viz .z-bad { fill:var(--bad-soft); } .viz .z-warn { fill:var(--warn-soft); } .viz .z-ok { fill:var(--ok-soft); } .viz .z-charge { fill:var(--charge-soft); } .viz .z-top { fill:var(--top-soft); } .viz .z-none { fill:var(--surface-2); }
.viz .s-ok { fill:var(--ok); } .viz .s-bad { fill:var(--bad); } .viz .s-warn { fill:var(--warn); } .viz .s-muted { fill:var(--line); }
.viz .cell { fill:var(--surface-2); stroke:var(--faint); stroke-width:1.2; }
.viz .cell-fill { fill:var(--ok); opacity:.75; }
.viz .flow-c { stroke:var(--charge); fill:none; stroke-linecap:round; } .viz .flow-d { stroke:var(--dis); fill:none; stroke-linecap:round; }

/* fields */
.field { padding:14px 0; border-top:1px solid var(--line); display:grid; gap:6px; }
.field:first-child { border-top:0; padding-top:4px; }
.f-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.f-label { font-weight:600; font-size:1rem; }
.f-head code { color:var(--faint); overflow-wrap:anywhere; }
.field.changed .f-label::after { content:"changed"; margin-left:8px; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--charge);
  border:1px solid var(--charge); border-radius:99px; padding:1px 7px; vertical-align:2px; font-weight:600; }
.f-plain { margin:0; color:var(--muted); font-size:.9rem; }
.f-ctl { display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-width:0; }
.f-meta { display:flex; gap:12px; color:var(--faint); font-size:.8rem; flex-wrap:wrap; align-items:center; }
.f-err { color:var(--bad); font-size:.85rem; }
.f-err:empty { display:none; }
.link { background:none; border:0; padding:0; color:var(--charge); cursor:pointer; font-size:.82rem; text-decoration:underline; text-underline-offset:2px; }
.link[hidden] { display:none; }

input[type=text], input[type=number], input[type=password], input[type=search], select, textarea {
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:8px 10px; font:inherit; font-size:.95rem; min-width:0; }
input[type=number] { width:110px; font-variant-numeric:tabular-nums; }
input[type=text].wide, textarea { width:100%; }
input:focus, select:focus, textarea:focus { border-color:var(--charge); outline:none; }
input[type=range] { flex:1 1 180px; min-width:120px; max-width:360px; accent-color:var(--charge); }
.unit { color:var(--muted); font-size:.9rem; }
.switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
.switch input { position:absolute; opacity:0; width:1px; height:1px; }
.switch .track { width:44px; height:24px; border-radius:99px; background:var(--line); position:relative; transition:background .2s; flex:0 0 auto; }
.switch .track::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--ink); transition:transform .2s; }
.switch input:checked + .track { background:var(--charge); }
.switch input:checked + .track::after { transform:translateX(20px); background:#fff; }
.switch input:focus-visible + .track { outline:2px solid var(--charge); outline-offset:2px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; flex-wrap:wrap; }
.seg button { border:0; background:none; padding:7px 12px; cursor:pointer; color:var(--muted); font-size:.88rem; }
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg); font-weight:600; }
.btn { border:1px solid var(--line); background:var(--surface-2); padding:8px 14px; border-radius:4px; cursor:pointer; font-size:.9rem; }
.btn:hover:not(:disabled) { border-color:var(--ink); }
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; }
.btn.small { padding:4px 10px; font-size:.82rem; }
.btn.danger { color:var(--bad); }
.btn:disabled { opacity:.45; cursor:default; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

.callout { border:1px solid var(--line); border-left:3px solid var(--charge); background:var(--surface); padding:10px 14px; border-radius:4px; font-size:.92rem; color:var(--muted); }
.callout b { color:var(--ink); }
.warns { display:flex; flex-direction:column; gap:6px; }
.warns:empty { display:none; }
.w { display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border-radius:4px; font-size:.9rem; }
.w.bad { background:var(--bad-soft); } .w.warn { background:var(--warn-soft); } .w.info { background:var(--charge-soft); }
.w .tag { font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:99px; flex:0 0 auto; margin-top:2px; }
.w.bad .tag { color:var(--bad); border:1px solid var(--bad); } .w.warn .tag { color:var(--warn); border:1px solid var(--warn); } .w.info .tag { color:var(--charge); border:1px solid var(--charge); }

.pills { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 2px; }
.pill { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--faint); }
.pill.now { color:var(--bg); background:var(--ink); border-color:var(--ink); font-weight:600; }
.cal { display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:4px; margin-top:8px; }
.cal div { aspect-ratio:1; max-width:100%; border-radius:3px; background:var(--surface-2); font-size:.62rem; color:var(--faint); display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.cal div.reset { background:var(--top-soft); color:var(--top); font-weight:600; outline:1px solid var(--top); }
.cal div.today { outline:2px solid var(--ink); color:var(--ink); }

table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); font-size:.9rem; vertical-align:top; }
th { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600; }
.tbl { overflow-x:auto; }
.pts input[type=number] { width:86px; padding:5px 8px; }
.pts td { padding:5px 6px; vertical-align:middle; }

.nav-foot { display:flex; justify-content:space-between; gap:10px; margin-top:26px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; }
details.grp { border:1px solid var(--line); border-radius:6px; background:var(--surface); margin-bottom:8px; }
details.grp > summary { cursor:pointer; padding:12px 16px; font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:.02em; list-style:none; display:flex; gap:10px; align-items:center; }
details.grp > summary::-webkit-details-marker { display:none; }
details.grp > summary::before { content:"›"; color:var(--faint); transition:transform .15s; display:inline-block; }
details.grp[open] > summary::before { transform:rotate(90deg); }
details.grp .body { padding:0 16px 8px; }
.toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.toolbar input[type=search] { flex:1 1 220px; max-width:360px; }
.toolbar label { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:.9rem; }
.preview { width:100%; min-height:220px; font-family:var(--mono); font-size:.8rem; line-height:1.5; white-space:pre; overflow:auto; }
.drop { border:1.5px dashed var(--faint); border-radius:6px; padding:18px; text-align:center; color:var(--muted); }
.drop.over { border-color:var(--charge); background:var(--charge-soft); color:var(--ink); }
.confirm { border:1px solid var(--warn); background:var(--warn-soft); padding:10px 12px; border-radius:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg);
  padding:9px 16px; border-radius:4px; font-size:.9rem; z-index:20; box-shadow:0 6px 24px rgba(0,0,0,.3); max-width:calc(100% - 32px); }
.kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px; }
.kv .k { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.kv .v { font-family:var(--display); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; }
.kv .v small { font-size:.9rem; color:var(--muted); font-weight:500; }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition:none; } }
</style>

<header class="top">
  <div class="brand"><b>JK BMS Setup</b><span>dbus-serialbattery · config.ini</span></div>
  <span class="spacer"></span>
  <button type="button" class="chip" id="chip-changes" title="Open Review and back up">0 changed</button>
  <button type="button" class="chip" id="chip-warn" hidden></button>
  <button type="button" class="chip" id="chip-motion" aria-pressed="true">Animations on</button>
</header>
<div class="layout">
  <nav id="rail" aria-label="Setup steps"></nav>
  <main id="main"></main>
</div>

<script>
'use strict';
// ------------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(9)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fx = (v, n) => Number.isFinite(v) ? v.toFixed(n) : '–';
const T = (x, y, s, cls, anchor) => `<text x="${x}" y="${y}" class="${cls || ''}" text-anchor="${anchor || 'start'}">${esc(s)}</text>`;
function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }

// ------------------------------------------------------------- the settings
// Every key of dbus-serialbattery's config.default.ini (upstream master), in file order.
// t: bool | int | float | select | text | list | bms | secret.  jk: false = not used by a JK BMS on Bluetooth.
const GROUPS = [], DEF = {};
function grp(id, title, jk) { GROUPS.push({ id, title, jk, keys: [] }); }
function s(key, d, t, label, plain, x) {
  const g = GROUPS[GROUPS.length - 1];
  DEF[key] = Object.assign({ key, d, t, label, plain, g: g.id, jk: g.jk }, x || {});
  g.keys.push(key);
}
const ON_OFF_EMPTY = { empty: 'off' };

grp('log', 'Logging', true);
s('LOGGING', 'INFO', 'select', 'Log detail', 'How much the driver writes to its log. INFO is right for daily use; DEBUG only while you chase a problem, it fills the log fast.', { opts: [['ERROR', 'Errors'], ['WARNING', 'Warnings'], ['INFO', 'Info'], ['DEBUG', 'Debug']] });

grp('currents', 'Battery current limits', true);
s('MAX_BATTERY_CHARGE_CURRENT', '50.0', 'float', 'Highest charge current', 'The most current the driver ever lets into the battery. Every other limit can only lower it. Keep it at or below what the cells and the JK BMS are rated for.', { unit: 'A', min: 0, max: 400, step: 1 });
s('MAX_BATTERY_DISCHARGE_CURRENT', '60.0', 'float', 'Highest discharge current', 'The most current the driver lets the inverter and loads take. Keep it below the BMS discharge protection so the driver limits first.', { unit: 'A', min: 0, max: 400, step: 1 });

grp('voltages', 'Cell voltages', true);

const STORE = 'jkbms-setup-guide-v1';
const BAT_DEFAULT = { cells: 4, ah: 280, ovp: 3.65, uvp: 2.8, bms: 200 };
const st = { vals: {}, extra: {}, bat: Object.assign({}, BAT_DEFAULT), view: 'connect', motion: true, dayTop: false, recDir: 'c', lastV: 3.30, allJk: true, allChanged: false, allQ: '' };
try { st.motion = !matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* keep default */ }
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const d = JSON.parse(raw);
    for (const [k, v] of Object.entries(d.vals || {})) if (DEF[k]) st.vals[k] = String(v);
    st.extra = d.extra || {};
    Object.assign(st.bat, d.bat || {});
  } catch (e) { /* storage blocked or broken: start from the defaults */ }
}
function persist() {
  try {
    const vals = {};
    for (const k of Object.keys(DEF)) if (isChanged(k) && DEF[k].t !== 'secret') vals[k] = get(k);
    localStorage.setItem(STORE, JSON.stringify({ vals, extra: st.extra, bat: st.bat }));
  } catch (e) { /* not available here */ }
}

const get = k => (st.vals[k] !== undefined ? st.vals[k] : DEF[k].d);
const num = k => parseFloat(get(k));
const numOr = (k, fb) => { const v = parseFloat(get(k)); return Number.isFinite(v) ? v : fb; };
const bool = k => /^true$/i.test(String(get(k)).trim());
const nums = t => String(t).split(',').map(x => x.trim()).filter(x => x !== '').map(Number);
function same(d, a, b) {
  a = String(a == null ? '' : a).trim(); b = String(b == null ? '' : b).trim();
  if (d.t === 'int' || d.t === 'float') return (a === '' || b === '') ? a === b : Number(a) === Number(b);
  if (d.t === 'list') { const x = nums(a), y = nums(b); return x.length === y.length && x.every((v, i) => v === y[i]); }
  if (d.t === 'bool' || d.t === 'select') return a.toLowerCase() === b.toLowerCase();
  if (d.t === 'bms') return a.split(',').map(x => x.trim().replace(/\s+/g, ' ')).join(',') === b.split(',').map(x => x.trim().replace(/\s+/g, ' ')).join(',');
  return a === b;
}
const isChanged = k => !same(DEF[k], get(k), DEF[k].d);
const changedKeys = () => Object.keys(DEF).filter(isChanged);
function setVal(k, v) { st.vals[k] = String(v); changed(); }
const cells = () => clamp(Math.round(st.bat.cells) || 4, 1, 32);
function bmsEntries() {
  return String(get('BLUETOOTH_BMS')).split(',').map(x => x.trim()).filter(Boolean).map(x => { const p = x.split(/\s+/); return { type: p[0] || '', mac: p[1] || '' }; });
}
const MAC_RE = /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/i;
function pairs(xk, yk) {
  const xs = nums(get(xk)), ys = nums(get(yk));
  if (!xs.length || xs.length !== ys.length || xs.some(isNaN) || ys.some(isNaN)) return null;
  return xs.map((x, i) => [x, ys[i]]).sort((a, b) => a[0] - b[0]);

  main.append(h('p', { class: 'lead' }, 'dbus-serialbattery runs on the Pi and talks to the JK BMS over Bluetooth. Tell it which BMS to use, then reboot the Pi. Everything else on this page is optional fine tuning.'));

    const list = bmsEntries(), usb = bool('BLUETOOTH_USE_USB'), poll = bool('BLUETOOTH_USE_POLLING');

// ------------------------------------------------------------ step 2 battery
function stepBattery(main) {
  main.append(h('p', { class: 'lead' }, 'Copy a few numbers from the JK BMS app. They are not settings of the driver, but this guide uses them to draw the pictures, convert cell voltages to battery voltages and warn you when a setting is too close to a BMS limit.'));

  main.append(h('div', { class: 'card viz-card' }, viz('0 0 640 170', t => {
    const N = cells(), shown = Math.min(N, 16), gap = 6, w = Math.min(64, (600 - gap * (shown - 1)) / shown), x0 = (640 - (w * shown + gap * (shown - 1))) / 2;

    batField('ah', 'Capacity', 'Ah', 20, 1000, 5, 'JK app: Battery capacity. Used for the C-rate advice.'),
    batField('ovp', 'Cell over-voltage protection (OVP)', 'V', 3.5, 3.8, 0.005, 'JK app: Cell OVP. The BMS stops charging when any cell reaches this.'),
    batField('uvp', 'Cell under-voltage protection (UVP)', 'V', 2.5, 3.1, 0.005, 'JK app: Cell UVP. The BMS stops discharging when any cell falls to this.'),
    batField('bms', 'BMS rated current', 'A', 40, 600, 5, 'The current your JK model is built for, for example 200 A for a B2A24S20P.')));
}

// ----------------------------------------------------------- step 3 currents

}

// ----------------------------------------------------------- step 4 voltages
function lfp(p) { // a LiFePO4 voltage curve shape 0..1 → 0..1: steep ends, flat middle
  return p < 0.1 ? 0.35 * p / 0.1 : p > 0.9 ? 0.55 + 0.45 * (p - 0.9) / 0.1 : 0.35 + 0.2 * (p - 0.1) / 0.8;
}
function stepVoltages(main) {
  main.append(h('p', { class: 'lead' }, 'All voltages here are per cell. The driver multiplies them by the number of cells (' + cells() + ') and sends the result to your chargers. The JK BMS has its own hard limits; these settings keep the battery comfortably inside them.'));
  const cap = h('p', { class: 'viz-cap' }), tbl = h('div', { class: 'tbl' });
  main.append(h('div', { class: 'card viz-card' }, viz('0 0 640 190', t => {
    const B = st.bat, N = cells(), mn = num('MIN_CELL_VOLTAGE'), mx = num('MAX_CELL_VOLTAGE'), fl = num('FLOAT_CELL_VOLTAGE'), rs = num('SOC_RESET_CELL_VOLTAGE');

    const zones = [[lo, B.uvp, 'z-bad'], [B.uvp, mn, 'z-warn'], [mn, fl, 'z-ok'], [fl, mx, 'z-charge']];
    if (resetOn && rs > mx) zones.push([mx, rs, 'z-top']);
    zones.push([resetOn ? Math.max(mx, rs) : mx, B.ovp, 'z-none'], [B.ovp, hi, 'z-bad']);
    let o = '';
    zones.forEach(([a, b, c]) => { if (b > a) o += `<rect x="${X(a)}" y="78" width="${X(b) - X(a)}" height="28" class="${c}"/>`; });
    o += `<rect x="20" y="78" width="600" height="28" class="grid"/>`;
    const marks = [[B.uvp, 'BMS UVP', 't-bad'], [mn, 'Empty', 't-warn'], [fl, 'Float', 't-ok'], [mx, 'Full', 't-charge']];
    if (resetOn) marks.push([rs, 'Top balance', 't-top']);
    marks.push([B.ovp, 'BMS OVP', 't-bad']);
    marks.sort((a, b) => a[0] - b[0]).forEach(([v, l, c], i) => {
      const row = i % 4, up = row % 2 === 0, y = up ? (row === 0 ? 66 : 40) : (row === 1 ? 126 : 152), x = X(v);
      o += `<line x1="${x}" y1="${up ? y + 4 : 106}" x2="${x}" y2="${up ? 78 : y - 12}" class="axis"/>`;
      o += T(x, y - (up ? 12 : 0), l, c, 'middle') + T(x, y + (up ? 2 : 13), fx(v, 3) + ' V', 't-small', 'middle');
    });
    const p = 0.5 - 0.5 * Math.cos(t * 2 * Math.PI / 14), topV = resetOn ? Math.max(rs, mx) : mx, cv = mn + (topV - mn) * lfp(p);

    o += `<line x1="${X(cv)}" y1="72" x2="${X(cv)}" y2="112" stroke-width="3" class="l-ink"/><circle cx="${X(cv)}" cy="72" r="4" class="f-ink"/>`;
    cap.replaceChildren('A cell going through a day: ', h('b', {}, fx(cv, 3) + ' V'), ' per cell = ', h('b', {}, fx(cv * N, 2) + ' V'), ' for the battery, ' + zone + '.');
    return o;
  }, 'Cell voltage scale with the BMS limits and your settings'), cap));
  const table = () => {
    const B = st.bat, N = cells(), drop = numOr('VOLTAGE_DROP', 0), resetOn = String(get('SOC_RESET_AFTER_DAYS')).trim() !== '';

}

// ------------------------------------------------------- step 5 charge cycle
function dayModel() {
  const N = cells(), mx = num('MAX_CELL_VOLTAGE'), fl = num('FLOAT_CELL_VOLTAGE'), rs = num('SOC_RESET_CELL_VOLTAGE');
  const resetOn = String(get('SOC_RESET_AFTER_DAYS')).trim() !== '', top = st.dayTop && resetOn, target = top ? Math.max(rs, mx) : mx;
  const cvcm = bool('CVCM_ENABLE'), thr = numOr('SWITCH_TO_FLOAT_CELL_VOLTAGE_DIFF', 10), diffOn = thr > 0 && thr < 10;
  const waitH = Math.max(0, numOr('SWITCH_TO_FLOAT_WAIT_FOR_SEC', 0)) / 3600;
  const bulkSoc = numOr('SWITCH_TO_BULK_SOC_THRESHOLD', 0);
  const tFull = 5.5, d0 = top ? 0.045 : 0.030, k = 1.3, tDis = 11;
  const balH = diffOn ? Math.max(0, Math.log(d0 / Math.max(thr, 0.001)) / k) : 0;
  const absH = Math.min(balH + waitH, 5), tBal = tFull + Math.min(balH, 5), tFloat = tFull + absH;
  const socEnd = 35;
  const soc = h_ => h_ < tFull ? 40 + 59 * h_ / tFull : h_ < tDis ? 100 : 100 - (100 - socEnd) * (h_ - tDis) / 13;
  let tBulk = null;
  if (cvcm && bulkSoc > 0) tBulk = bulkSoc >= 100 ? tDis : bulkSoc > socEnd ? tDis + (100 - bulkSoc) / (100 - socEnd) * 13 : null;
  const cvl = h_ => !cvcm ? target : h_ < tFloat ? target : (tBulk !== null && h_ >= tBulk) ? mx : fl;
  const restV = cvcm ? fl : target;
  const cellV = h_ => h_ < tFull ? 3.28 + (target - 3.28) * Math.pow(h_ / tFull, 6) : h_ < tFloat ? target : h_ < tDis ? (cvcm ? fl + (target - fl) * Math.exp(-(h_ - tFloat) * 3) : target) : 3.24 + (restV - 3.24) * Math.exp(-(h_ - tDis) * 1.6) - 0.002 * (h_ - tDis);
  const diff = h_ => h_ < tFull - 1 ? 0.005 : h_ < tFull ? 0.005 + (d0 - 0.005) * (h_ - tFull + 1) : h_ < tDis ? Math.max(0.004, d0 * Math.exp(-k * (h_ - tFull))) : 0.006;
  const phase = h_ => {
    if (!cvcm) return h_ < tFull ? ['bulk', 'Charging'] : h_ < tDis ? ['abs', 'Held at full voltage'] : ['dis', 'Discharging'];
    if (h_ < tFull) return ['bulk', 'Bulk'];
    if (h_ < tBal) return ['abs', 'Absorption: balancing'];
    if (h_ < tFloat) return ['abs', 'Absorption: timer'];
    if (tBulk !== null && h_ >= tBulk) return ['rebulk', 'Ready for a full charge'];
    return ['float', h_ < tDis ? 'Float' : 'Float, discharging'];
  };

}
const clockOf = h_ => { const m = Math.round((7 + h_) * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
function stepCharging(main) {
  main.append(h('p', { class: 'lead' }, 'A good charge cycle fills the battery, gives the balancer time to even out the cells, and then lets the battery rest at a lower float voltage. Every few days it can charge a bit higher so the JK BMS resets its SoC and top balances.'));
  const pills = h('div', { class: 'pills' }), cap = h('p', { class: 'viz-cap' });
  const resetOn = () => String(get('SOC_RESET_AFTER_DAYS')).trim() !== '';
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Which day to show' });
  const paintSeg = () => {
    seg.replaceChildren(...[[false, 'Normal day'], [true, 'Top balance day']].map(([v, l]) => h('button', { type: 'button', 'aria-pressed': String(st.dayTop === v), disabled: v && !resetOn() ? true : null,
      onclick: () => { st.dayTop = v; paintSeg(); dirty = true; } }, l)));
    if (!resetOn() && st.dayTop) { st.dayTop = false; paintSeg(); }
  };
  paintSeg(); hooks.push(paintSeg);
  main.append(h('div', { class: 'card viz-card' }, h('div', { class: 'row', style: 'justify-content:space-between' }, pills, seg),
    viz('0 0 640 300', t => {
      const M = dayModel(), X = h_ => 52 + h_ / 24 * 568;
      const vLo = 3.18, vHi = Math.max(M.target, M.mx) + 0.04, Y = v => 170 - (v - vLo) / (vHi - vLo) * 150, YS = s => 272 - s / 100 * 70;
      let o = '';
      // phase bands
      const band = (a, b, c) => { if (b > a) o += `<rect x="${X(a)}" y="20" width="${X(b) - X(a)}" height="150" class="${c}"/>`; };
      if (M.cvcm) { band(M.tFull, M.tFloat, M.top ? 'z-top' : 'z-charge'); band(M.tFloat, M.tBulk !== null ? M.tBulk : 24, 'z-ok'); }
      else band(M.tFull, M.tDis, 'z-charge');
      // grid + axes
      [3.2, 3.3, 3.4, 3.5, 3.6, 3.7].filter(v => v > vLo && v < vHi).forEach(v => { o += `<line x1="52" x2="620" y1="${Y(v)}" y2="${Y(v)}" class="grid"/>` + T(46, Y(v) + 4, fx(v * M.N, 1), 't-small', 'end'); });
      o += T(46, 14, 'V', 't-small', 'end');
      for (let i = 0; i <= 6; i++) { const hh = i * 4; o += T(X(hh), 296, clockOf(hh), 't-small', 'middle'); }
      o += `<rect x="52" y="202" width="568" height="70" class="grid"/>` + T(46, 206, '100%', 't-small', 'end') + T(46, 274, '0%', 't-small', 'end');
      // lines
      let cv = '', pv = '', sp = '';
      for (let i = 0; i <= 240; i++) { const hh = i / 10; cv += (i ? 'L' : 'M') + X(hh).toFixed(1) + ',' + Y(M.cvl(hh)).toFixed(1); pv += (i ? 'L' : 'M') + X(hh).toFixed(1) + ',' + Y(M.cellV(hh)).toFixed(1); sp += 'L' + X(hh).toFixed(1) + ',' + YS(M.soc(hh)).toFixed(1); }
      o += `<path d="M52,272${sp}L620,272Z" class="a-charge"/><path d="${'M' + sp.slice(1)}" class="l-charge" stroke-width="1.5"/>`;
      o += `<path d="${pv}" class="l-ink"/><path d="${cv}" class="l-charge"/>`;
      if (M.cvcm && M.bulkSoc > 0 && M.bulkSoc < 100) o += `<line x1="52" x2="620" y1="${YS(M.bulkSoc)}" y2="${YS(M.bulkSoc)}" class="l-warn"/>` + T(616, YS(M.bulkSoc) - 4, 'full charge again below ' + M.bulkSoc + ' %', 't-warn', 'end');
      o += T(58, 196, 'State of charge', 't-small');
      o += `<line x1="430" x2="450" y1="12" y2="12" class="l-charge"/>` + T(454, 16, 'charge voltage (CVL)', 't-small') + `<line x1="560" x2="580" y1="12" y2="12" class="l-ink"/>` + T(584, 16, 'battery', 't-small');
      // playhead
      const hh = (t % 20) / 20 * 24, x = X(hh);
      o += `<line x1="${x}" x2="${x}" y1="20" y2="272" class="playhead"/><circle cx="${x}" cy="${Y(M.cvl(hh))}" r="4" class="f-charge"/><circle cx="${x}" cy="${Y(M.cellV(hh))}" r="3.5" class="f-ink"/><circle cx="${x}" cy="${YS(M.soc(hh))}" r="3.5" class="f-charge"/>`;
      // texts
      const [pid, pname] = M.phase(hh), d = M.diff(hh), soc = M.soc(hh);
      const order = M.cvcm ? [['bulk', 'Bulk'], ['abs', 'Absorption'], ['float', 'Float'], ['rebulk', 'Full charge again']] : [['bulk', 'Charging'], ['abs', 'Held at full'], ['dis', 'Discharging']];
      pills.replaceChildren(...order.map(([id, l]) => h('span', { class: 'pill' + (id === pid ? ' now' : '') }, l)));
      let why = '';
      if (pid === 'bulk') why = `Chargers push current until the battery reaches ${fx(M.target * M.N, 2)} V (${fx(M.target, 3)} V per cell)${M.top ? ', the top balance voltage' : ''}.`;

    const ph = 0.5 - 0.5 * Math.cos(t * 2 * Math.PI / (o.period || 10)), v = o.sweep[0] + (o.sweep[1] - o.sweep[0]) * ph, f = on ? curveAt(p, v, o.side) : 1;
    s += `<line x1="${X(v)}" x2="${X(v)}" y1="25" y2="190" class="playhead"/><circle cx="${X(v)}" cy="${Y(f)}" r="5.5" class="${isC ? 'f-charge' : 'f-dis'}"/>`;
    s += `<rect x="512" y="${Y(f)}" width="8" height="${Y(0) - Y(f)}" class="${isC ? 'f-charge' : 'f-dis'}"/>`;
    cap.replaceChildren(o.what + ' ', h('b', {}, fx(v, o.dec) + ' ' + o.unit), ' → ', h('b', {}, fx(f * max, 1) + ' A'), ` allowed (${fx(f * 100, 0)} % of ${fx(max, 0)} A)` + (on ? '' : '. This limit is off.'));
    return s;
  }, o.title);
  const fill = () => {
    const xs = nums(get(o.xKey)), ys = nums(get(o.yKey)), n = Math.max(xs.length, ys.length);
    tbody.replaceChildren();
    for (let i = 0; i < n; i++) {
      const xi = h('input', { type: 'number', step: o.unit === 'V' ? 0.005 : 1, 'aria-label': 'Point ' + (i + 1) + ' ' + o.unit }); xi.value = xs[i] !== undefined ? xs[i] : '';
      const yi = h('input', { type: 'number', step: 0.5, min: 0, max: 100, 'aria-label': 'Point ' + (i + 1) + ' percent' }); yi.value = ys[i] !== undefined ? +(ys[i] * 100).toFixed(2) : '';
      xi.addEventListener('input', write); yi.addEventListener('input', write);

      h('div', { class: 'tbl' }, h('table', { class: 'pts' }, h('thead', {}, h('tr', {}, h('th', {}, o.unit === 'V' ? 'Cell voltage' : o.unit === '°C' ? 'Temperature' : 'SoC'), h('th', {}, 'Current allowed'), h('th'))), tbody)),

// ---------------------------------------------------------- step 10 recovery

    if (ramp) o += T((X(tClear + hold) + X(tClear + hold + ramp)) / 2, 44, 'ramp ' + rate + ' A/s', c ? 't-charge' : 't-dis', 'middle');
    [0, 0.5, 1].forEach(f => { o += `<line x1="50" x2="610" y1="${Y(f * max)}" y2="${Y(f * max)}" class="grid"/>` + T(44, Y(f * max) + 4, fx(f * max, 0) + ' A', 't-small', 'end'); });
    if (thr > 0) o += `<line x1="50" x2="610" y1="${Y(thr)}" y2="${Y(thr)}" class="l-warn"/>` + T(606, Y(thr) - 4, 'restart above ' + fx(thr, 2) + ' A', 't-warn', 'end');
    let d = ''; for (let i = 0; i <= 300; i++) { const s_ = span * i / 300; d += (i ? 'L' : 'M') + X(s_).toFixed(1) + ',' + Y(lim(s_)).toFixed(1); }
    o += `<path d="${d}" class="${c ? 'l-charge' : 'l-dis'}"/>`;
    [0, Math.round(span / 2), Math.round(span)].forEach(s_ => { o += T(X(s_), 204, s_ + ' s', 't-small', 'middle'); });
    const s0 = (t % 12) / 12 * span;
    o += `<line x1="${X(s0)}" x2="${X(s0)}" y1="30" y2="180" class="playhead"/><circle cx="${X(s0)}" cy="${Y(lim(s0))}" r="5" class="${c ? 'f-charge' : 'f-dis'}"/>`;
    cap.replaceChildren(h('b', {}, (c ? 'Charge' : 'Discharge') + ' limit ' + fx(lim(s0), 1) + ' A'), ` · back to the full ${fx(max, 0)} A ${fx(hold + ramp, 0)} s after the reason is gone.`);
    return o;
  }, 'Current limit dropping and recovering'), cap));
  main.append(warnBox('recovery'));
  main.append(h('h2', {}, 'Charging'), fields(['CCL_RECOVERY_HOLD_SEC', 'CCL_RECOVERY_RATE_A_PER_SEC', 'CHARGE_CURRENT_RECOVERY_THRESHOLD_PERCENT']));
  main.append(h('h2', {}, 'Discharging'), fields(['DCL_RECOVERY_HOLD_SEC', 'DCL_RECOVERY_RATE_A_PER_SEC', 'DISCHARGE_CURRENT_RECOVERY_THRESHOLD_PERCENT']));
  main.append(callout('These options come with the newest dbus-serialbattery. If your Pi runs an older version, the Venus page shows only the settings your version knows.'));
}

// ------------------------------------------------------------ export / import
function iniText() {
  const ch = changedKeys().filter(k => DEF[k].t !== 'secret'), B = st.bat, now = new Date();
  const lines = ['; dbus-serialbattery config.ini', '; Made with the JK BMS Setup guide on ' + now.toISOString().slice(0, 10) + '.',
    '; Only settings that differ from config.default.ini are listed; the driver uses the defaults for the rest.',
    '; Goes to /data/apps/dbus-serialbattery/config.ini on the Pi.',
    `; guide-battery: cells=${B.cells} ah=${B.ah} ovp=${B.ovp} uvp=${B.uvp} bms=${B.bms}`, '', '[DEFAULT]'];
  let lastG = null;
  for (const g of GROUPS) for (const k of g.keys) {
    if (!ch.includes(k)) continue;
    if (g.id !== lastG) { lines.push('', '; --- ' + g.title); lastG = g.id; }
    lines.push(k + ' = ' + get(k));
  }
  const ex = Object.entries(st.extra || {});
  if (ex.length) { lines.push('', '; --- Kept from your file (not known to this guide)'); ex.forEach(([k, v]) => lines.push(k + ' = ' + v)); }
  if (!ch.length && !ex.length) lines.push('; (nothing changed: all defaults)');
  return lines.join('\n') + '\n';
}
function jsonText() {
  const config = {}; changedKeys().filter(k => DEF[k].t !== 'secret').forEach(k => { config[k] = get(k); });
  return JSON.stringify({ app: 'jk-bms-setup-guide', version: 1, created: new Date().toISOString(), driver: 'dbus-serialbattery', battery: st.bat, config, unknown: st.extra || {} }, null, 2) + '\n';
}
function parseIni(text) {
  const values = {}, bat = {};
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const g = line.match(/^[;#]\s*guide-battery:\s*(.*)$/i);
    if (g) { g[1].split(/\s+/).forEach(p => { const [k, v] = p.split('='); if (k && v !== undefined && Number.isFinite(parseFloat(v))) bat[k] = parseFloat(v); }); continue; }
    if (!line || line[0] === ';' || line[0] === '#' || line[0] === '[') continue;
    const m = line.match(/^([A-Za-z0-9_]+)\s*[=:]\s*(.*)$/);
    if (m) values[m[1].toUpperCase()] = m[2].trim();
  }
  return { values, bat };
}
function parseAny(text) {
  const t = text.trim();
  if (t.startsWith('{')) {
    const d = JSON.parse(t);
    if (!d || typeof d !== 'object' || !d.config) throw new Error('This JSON file is not a backup from this guide.');
    return { values: Object.assign({}, d.unknown || {}, d.config), bat: d.battery || {} };
  }
  const r = parseIni(text);
  if (!Object.keys(r.values).length && !Object.keys(r.bat).length) throw new Error('No settings found. A config.ini has lines like MAX_CELL_VOLTAGE = 3.45.');
  return r;
}
function applyImport(r) {
  st.vals = {}; st.extra = {};
  let known = 0;
  for (const [k, v] of Object.entries(r.values)) { if (DEF[k]) { if (DEF[k].t !== 'secret') { st.vals[k] = String(v); known++; } } else st.extra[k] = String(v); }
  for (const k of Object.keys(BAT_DEFAULT)) if (Number.isFinite(parseFloat(r.bat[k]))) st.bat[k] = parseFloat(r.bat[k]);
  changed();
  return { known, unknown: Object.keys(st.extra).length };
}
let dl = null;
async function saveFile(name, text) {
  if (!dl) { toast('Saving files is not available here. Use Copy instead.'); return; }
  try { await dl.save({ filename: name, data: text }); toast('Saved ' + name); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'A save is already open.' : 'Could not save the file. Use Copy instead.'); }
}
function copyText(text, ta) {
  const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast('Copy blocked here: the text is selected, press Ctrl+C / ⌘C.'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}

// ------------------------------------------------------------ step 11 backup
function stepBackup(main) {
  main.append(h('p', { class: 'lead' }, 'Check what you changed, then save it. The backup is the same config.ini the driver reads, so you can put it straight back on the Pi or load it here again later.'));
  main.append(warnBox('*'));
  // summary of changes
  const sumBox = h('div', { class: 'card tbl' });
  const paintSum = () => {
    const ch = changedKeys();
    sumBox.replaceChildren(ch.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Setting', 'Default', 'Yours', ''].map(x => h('th', {}, x)))),
      h('tbody', {}, ch.map(k => h('tr', {}, h('td', {}, h('div', {}, DEF[k].label), h('code', { class: 'muted' }, k)), h('td', { class: 'muted' }, DEF[k].d === '' ? '(empty)' : DEF[k].d),
        h('td', { style: 'font-weight:600' }, get(k) === '' ? '(empty)' : get(k)), h('td', {}, h('button', { type: 'button', class: 'link', onclick: () => go(stepOf(k), k) }, 'edit'))))))
      : h('p', { class: 'muted', style: 'margin:0' }, 'Nothing changed yet: the driver would run on its defaults. Go through the steps, or load a backup below.'));
  };
  hooks.push(paintSum); paintSum();
  main.append(h('h2', {}, 'What you changed'), sumBox);

  // export
  const ta = h('textarea', { class: 'preview', id: 'ini-preview', readonly: true, spellcheck: 'false', 'aria-label': 'config.ini preview' });
  const paintIni = () => { ta.value = iniText(); }; hooks.push(paintIni); paintIni();
  const saveIni = h('button', { type: 'button', class: 'btn primary', onclick: () => saveFile('dbus-serialbattery-config.ini.txt', iniText()) }, 'Save config.ini backup');
  const saveJson = h('button', { type: 'button', class: 'btn', onclick: () => saveFile('jk-bms-settings-' + new Date().toISOString().slice(0, 10) + '.json', jsonText()) }, 'Save as JSON');
  const saveBtns = [saveIni, saveJson];
  saveBtns.forEach(b => { b.hidden = !dl; });
  hooks.push(() => saveBtns.forEach(b => { b.hidden = !dl; }));
  main.append(h('h2', {}, 'Export'), h('div', { class: 'card stack' },
    h('div', { class: 'row' }, ...saveBtns, h('button', { type: 'button', class: 'btn', onclick: () => copyText(iniText(), ta) }, 'Copy config.ini')),
    h('p', { class: 'f-plain' }, 'The file is saved as .ini.txt because the browser frame only allows a few file types; rename it to config.ini if you copy it to the Pi. Your battery numbers from step 2 travel along as a comment line.'),
    ta));

  // import
  const status = h('div', { 'aria-live': 'polite' });
  const fileIn = h('input', { type: 'file', id: 'import-file', accept: '.ini,.txt,.json,text/plain,application/json', hidden: true });
  const paste = h('textarea', { id: 'import-paste', rows: 5, placeholder: 'Or paste the contents of a config.ini here…', spellcheck: 'false', style: 'font-family:var(--mono);font-size:.8rem' });
  let pending = null;
  const offer = (text, from) => {
    let r;
    try { r = parseAny(text); } catch (e) { status.replaceChildren(h('div', { class: 'w bad' }, h('span', { class: 'tag' }, 'fix'), h('span', {}, from + ': ' + e.message))); return; }
    pending = r;
    const nKnown = Object.keys(r.values).filter(k => DEF[k]).length, nNew = Object.keys(r.values).length - nKnown, nNow = changedKeys().length;
    status.replaceChildren(h('div', { class: 'confirm' }, h('span', {}, `${from}: ${nKnown} settings${nNew ? ', ' + nNew + ' not known to this guide (kept)' : ''}${Object.keys(r.bat).length ? ', battery numbers' : ''}. `,
      nNow ? h('b', {}, `This replaces your ${nNow} current change${nNow === 1 ? '' : 's'}.`) : ''),
      h('button', { type: 'button', class: 'btn primary small', onclick: () => { const res = applyImport(pending); pending = null; render(); toast(`Loaded ${res.known} settings${res.unknown ? ', kept ' + res.unknown + ' unknown' : ''}`); } }, 'Load it'),
      h('button', { type: 'button', class: 'btn small', onclick: () => { pending = null; status.replaceChildren(); } }, 'Cancel')));
  };
  const readFile = f => { if (!f) return; const rd = new FileReader(); rd.onload = () => offer(String(rd.result), f.name); rd.onerror = () => toast('Could not read ' + f.name); rd.readAsText(f); };
  fileIn.addEventListener('change', () => { readFile(fileIn.files[0]); fileIn.value = ''; });
  const drop = h('div', { class: 'drop' }, 'Drop a config.ini, .txt or .json backup here, or ', h('button', { type: 'button', class: 'link', onclick: () => fileIn.click() }, 'choose a file'), fileIn);
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); });
  main.append(h('h2', {}, 'Import'), h('div', { class: 'card stack' }, drop, paste,
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', onclick: () => paste.value.trim() ? offer(paste.value, 'Pasted text') : toast('Paste a config.ini first') }, 'Load pasted text')), status));

  // reset all
  const resetBox = h('div');
  const askReset = () => resetBox.replaceChildren(h('div', { class: 'confirm' }, h('span', {}, 'Set every setting back to the dbus-serialbattery default?'),
    h('button', { type: 'button', class: 'btn danger small', onclick: () => { st.vals = {}; st.extra = {}; changed(); render(); toast('All settings are back to default'); } }, 'Yes, reset all'),
    h('button', { type: 'button', class: 'btn small', onclick: () => resetBox.replaceChildren() }, 'Cancel')));
  main.append(h('h2', {}, 'On the Pi'), h('div', { class: 'card' }, h('ol', { style: 'margin:0;padding-left:20px;display:grid;gap:6px' },
    h('li', {}, 'Venus web page → ', h('b', {}, 'Files & logs'), ' → dbus-serialbattery: config.ini. Paste the text and save. (Or copy the file to ', h('code', {}, '/data/apps/dbus-serialbattery/config.ini'), '.)'),
    h('li', {}, 'Restart dbus-serialbattery from the Overview tab. Changed Bluetooth settings need a reboot of the Pi.'),
    h('li', {}, 'To back up from the Pi: open the same config.ini, copy everything, and load it here with ', h('b', {}, 'Import'), '. config.ini survives driver updates; keep a copy anyway before you reinstall Venus OS.'))),
  h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { type: 'button', class: 'btn danger', onclick: askReset }, 'Reset all to default')), resetBox);
}

// ------------------------------------------------------------- all settings
function viewAll(main) {
  main.append(h('p', { class: 'lead' }, 'Every setting of dbus-serialbattery in one place, in the order of config.default.ini. Settings that a JK BMS on Bluetooth does not use are hidden unless you ask for them.'));
  const q = h('input', { type: 'search', id: 'all-q', placeholder: 'Search: name, key or words…', 'aria-label': 'Search settings' }); q.value = st.allQ;
  const jk = h('input', { type: 'checkbox', id: 'all-jk' }); jk.checked = st.allJk;
  const onlyCh = h('input', { type: 'checkbox', id: 'all-ch' }); onlyCh.checked = st.allChanged;
  main.append(h('div', { class: 'toolbar' }, q, h('label', { for: 'all-jk' }, jk, 'Only what a JK BMS uses'), h('label', { for: 'all-ch' }, onlyCh, 'Only changed')));
  main.append(warnBox('all'));
  const box = h('div'), empty = h('p', { class: 'muted', hidden: true }, 'No setting matches.');
  const groups = GROUPS.map(g => {
    const rows = g.keys.map(k => { const r = field(k); const st_ = stepOf(k); if (st_ !== 'all') r.querySelector('.f-meta').append(h('button', { type: 'button', class: 'link', onclick: () => go(st_, k) }, 'Explained in step ' + (STEPS.findIndex(x => x.id === st_) + 1))); return { k, r }; });
    const det = h('details', { class: 'grp' }, h('summary', {}, g.title, h('span', { class: 'chip' }, String(g.keys.length))), h('div', { class: 'body' }, rows.map(x => x.r)));
    box.append(det);
    return { g, det, rows };
  });
  const filter = () => {
    st.allQ = q.value; st.allJk = jk.checked; st.allChanged = onlyCh.checked;
    const s_ = q.value.trim().toLowerCase(); let total = 0;
    groups.forEach(({ det, rows }) => {
      let n = 0;
      rows.forEach(({ k, r }) => {
        const d = DEF[k], text = (k + ' ' + d.label + ' ' + d.plain).toLowerCase();
        const ok = (!s_ || text.includes(s_)) && (!jk.checked || d.jk || isChanged(k)) && (!onlyCh.checked || isChanged(k));
        r.hidden = !ok; if (ok) n++;
      });
      det.hidden = !n; det.querySelector('.chip').textContent = String(n); if ((s_ || onlyCh.checked) && n) det.open = true;
      total += n;
    });
    empty.hidden = total > 0;
  };
  [q, jk, onlyCh].forEach(x => x.addEventListener('input', filter));
  main.append(box, empty);
  filter();
}

// ------------------------------------------------------------------ boot
load();
renderRail();
$('#chip-changes').addEventListener('click', () => go('backup'));
$('#chip-warn').addEventListener('click', () => go('backup'));
const motionBtn = $('#chip-motion');
const paintMotion = () => { motionBtn.textContent = st.motion ? 'Animations on' : 'Animations off'; motionBtn.setAttribute('aria-pressed', String(st.motion)); motionBtn.className = 'chip' + (st.motion ? ' on' : ''); };
motionBtn.addEventListener('click', () => { st.motion = !st.motion; paintMotion(); dirty = true; });
paintMotion();
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== st.view) go(id); });
go(location.hash.slice(1) || 'connect');
requestAnimationFrame(frame);
(async () => {
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  hooks.forEach(f => f());
})();
</script>
