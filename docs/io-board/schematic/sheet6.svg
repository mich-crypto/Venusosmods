<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150" font-family="Helvetica, Arial, sans-serif"><rect width="1700" height="1150" fill="#fff"/><rect x="10" y="10" width="1680" height="1130" fill="none" stroke="#999" stroke-width="2"/><rect x="1270" y="1070" width="420" height="70" fill="#f7f7f7" stroke="#999"/><text x="1280" y="1098" font-size="15" font-weight="700">I/O board · 6 · Truma, CP plus 12 V, inputs</text><text x="1280" y="1122" font-size="12" fill="#555">Sheet 6/7 · planning schematic · not yet in KiCad</text><text x="30" y="46" font-size="24" font-weight="700">6 · Truma, CP plus 12 V, inputs</text><text x="30" y="72" font-size="14" fill="#555">TIN/LIN bus pass-through with transceiver; fused 12 V for the CP plus; 3 isolated inputs</text><text x="30" y="110" font-size="15" text-anchor="start" fill="#111" font-weight="700">Truma CP plus: TIN/LIN bus, in and out (wired 1:1, the board sits in the chain like a TIN distributor)</text><rect x="60" y="150" width="150" height="190" fill="#eef6ee" stroke="#1f6b3b" stroke-width="2.5" rx="4"/><text x="135.0" y="142" font-size="13" text-anchor="middle" fill="#1f6b3b" font-weight="700">RJ12 IN (from CP plus)</text><line x1="210" y1="170" x2="234" y2="170" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="174" font-size="11" text-anchor="start" fill="#111" font-weight="400">1 </text><line x1="210" y1="200" x2="234" y2="200" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="204" font-size="11" text-anchor="start" fill="#111" font-weight="400">2 </text><line x1="210" y1="230" x2="234" y2="230" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="234" font-size="11" text-anchor="start" fill="#111" font-weight="400">3 LIN</text><line x1="210" y1="260" x2="234" y2="260" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="264" font-size="11" text-anchor="start" fill="#111" font-weight="400">4 </text><line x1="210" y1="290" x2="234" y2="290" stroke="#1a1a1a" stroke-width="2"/><text x="68" y