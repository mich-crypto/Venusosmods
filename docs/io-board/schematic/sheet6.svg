 fill="#111" font-weight="400">LIN</text><line x1="536" y1="478" x2="560" y2="478" stroke="#1a1a1a" stroke-width="2"/><text x="566" y="482" font-size="11" text-anchor="start" fill="#111" font-weight="400">GND</text><line x1="536" y1="514" x2="560" y2="514" stroke="#1a1a1a" stroke-width="2"/><text x="566" y="518" font-size="11" text-anchor="start" fill="#111" font-weight="400">VBAT</text><line x1="536" y1="550" x2="560" y2="550" stroke="#1a1a1a" stroke-width="2"/><text x="566" y="554" font-size="11" text-anchor="start" fill="#111" font-weight="400">WAKE</text><line x1="750" y1="442" x2="774" y2="442" stroke="#1a1a1a" stroke-width="2"/><text x="744" y="446" font-size="11" text-anchor="end" fill="#111" font-weight="400">RXD</text><line x1="750" y1="478" x2="774" y2="478" stroke="#1a1a1a" stroke-width="2"/><text x="744" y="482" font-size="11" text-anchor="end" fill="#111" font-weight="400">TXD</text><line x1="750" y1="514" x2="774" y2="514" stroke="#1a1a1a" stroke-width="2"/><text x="744" y="518" font-size="11" text-anchor="end" fill="#111" font-weight="400">SLP_N</text><line x1="750" y1="550" x2="774" y2="550" stroke="#1a1a1a" stroke-width="2"/><text x="744" y="554" font-size="11" text-anchor="end" fill="#111" font-weight="400">INH</text><line x1="294" y1="430" x2="294" y2="442" stroke="#1a1a1a" stroke-width="2"/><line x1="294" y1="442" x2="536" y2="442" stroke="#1a1a1a" stroke-width="2"/><line x1="536" y1="478" x2="516" y2="478" stroke="#1a1a1a" stroke-width="2"/><line x1="502" y1="478" x2="530" y2="478" stroke="#1a1a1a" stroke-width="3"/><line x1="507" y1="483" x2="525" y2="483" stroke="#1a1a1a" stroke-width="2"/><line x1="512" y1="488" x2="520" y2="488" stroke="#1a1a1a" stroke-width="2"/><polygon points="276,514 286,503 348,503 348,525 286,525" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="288" y="519" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">V12_SYS</text><line x1="348" y1="514" x2="370" y2="514" stroke="#1a1a1a" stroke-width="2"/><line x1="396" y1="514" x2="418" y2="514" stroke="#1a1a1a" stroke-width="2"/><polygon points="370,504 370,524 396,514" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="396" y1="504" x2="396" y2="524" stroke="#1a1a1a" stroke-width="3"/><text x="383.0" y="498" font-size="11" text-anchor="middle" fill="#555" font-weight="400">D61</text><text x="383.0" y="540" font-size="12" text-anchor="middle" fill="#111" font-weight="700">SS14</text><circle cx="418" cy="514" r="4" fill="#1a1a1a"/><text x="476" y="504" font-size="11" text-anchor="middle" fill="#0b5394" font-weight="700">VBAT</text><line x1="418" y1="514" x2="536" y2="514" stroke="#1a1a1a" stroke-width="2"/><line x1="418" y1="514" x2="428" y2="514" stroke="#1a1a1a" stroke-width="2"/><polygon points="336,550 346,539 384,539 384,561 346,561" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="348" y="555" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">VBAT</text><line x1="384" y1="550" x2="404" y2="550" stroke="#1a1a1a" stroke-width="2"/><rect x="404" y="543" width="30" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="434" y1="550" x2="454" y2="550" stroke="#1a1a1a" stroke-width="2"/><text x="419.0" y="534" font-size="11" text-anchor="middle" fill="#555" font-weight="400">R61</text><text x="419.0" y="576" font-size="12" text-anchor="middle" fill="#111" font-weight="700">10k</text><line x1="454" y1="550" x2="536" y2="550" stroke="#1a1a1a" stroke-width="2"/><line x1="774" y1="442" x2="784" y2="442" stroke="#1a1a1a" stroke-width="2"/><polygon points="784,442 794,431 912,431 912,453 794,453" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="796" y="447" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO17 LIN_RXD</text><line x1="774" y1="478" x2="784" y2="478" stroke="#1a1a1a" stroke-width="2"/><polygon points="784,478 794,467 912,467 912,489 794,489" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="796" y="483" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO18 LIN_TXD</text><line x1="774" y1="514" x2="784" y2="514" stroke="#1a1a1a" stroke-width="2"/><polygon points="784,514 794,503 1008,503 1008,525 794,525" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="796" y="519" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO21 LIN_SLP (high = on)</text><text x="784" y="554" font-size="11" text-anchor="start" fill="#777" font-weight="400">not used</text><text x="560" y="630" font-size="12" text-anchor="start" fill="#555" font-weight="400">Slave node: no 1k master pull-up (the CP plus is the master); TJA1021 has its own 30k. RXD needs 10k pull-up to +3V3 (open drain).</text><text x="560" y="654" font-size="12" text-anchor="start" fill="#555" font-weight="400">VBAT 100n + 10µ to GND. D61 blocks reverse current. Same ground as the CP plus (RJ12 pin 5).</text><text x="30" y="730" font-size="15" text-anchor="start" fill="#111" font-weight="700">12 V supply for the CP plus panel (its own red / red-black wires)</text><polygon points="60,770 70,759 132,759 132,781 70,781" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="72" y="775" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">V12_AUX</text><line x1="132" y1="770" x2="150" y2="770" stroke="#1a1a1a" stroke-width="2"/><rect x="150" y="764" width="34" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="150" y1="770" x2="184" y2="770" stroke="#1a1a1a" stroke-width="1"/><line x1="184" y1="770" x2="202" y2="770" stroke="#1a1a1a" stroke-width="2"/><text x="167.0" y="754" font-size="11" text-anchor="middle" fill="#555" font-weight="400">F6</text><text x="167.0" y="796" font-size="12" text-anchor="middle" fill="#111" font-weight="700">1 A PTC</text><line x1="202" y1="770" x2="222" y2="770" stroke="#1a1a1a" stroke-width="2"/><polygon points="222,770 232,759 414,759 414,781 232,781" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="234" y="775" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">TRUMA 12V + → terminal</text><polygon points="60,830 70,819 100,819 100,841 70,841" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="72" y="835" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GND</text><line x1="100" y1="830" x2="120" y2="830" stroke="#1a1a1a" stroke-width="2"/><polygon points="120,830 130,819 312,819 312,841 130,841" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="132" y="835" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">TRUMA 12V − → terminal</text><text x="60" y="880" font-size="12" text-anchor="start" fill="#555" font-weight="400">From V12_AUX (EBL Spare 4, unswitched): the CP plus and its frost/timer functions stay powered with the EBL main switch off.</text><text x="980" y="730" font-size="15" text-anchor="start" fill="#111" font-weight="700">Inputs 1–3 (isolated, 5–30 V)</text><polygon points="1000,780 1010,769 1112,769 1112,791 1010,791" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="1012" y="785" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">IN1 terminal</text><line x1="1112" y1="780" x2="1134" y2="780" stroke="#1a1a1a" stroke-width="2"/><line x1="1160" y1="780" x2="1182" y2="780" stroke="#1a1a1a" stroke-width="2"/><polygon points="1134,770 1134,790 1160,780" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="1160" y1="770" x2="1160" y2="790" stroke="#1a1a1a" stroke-width="3"/><text x="1147.0" y="764" font-size="11" text-anchor="middle" fill="#555" font-weight="400">D70</text><text x="1147.0" y="806" font-size="12" text-anchor="middle" fill="#111" font-weight="700">1N4148W</text><line x1="1182" y1="780" x2="1202" y2="780" stroke="#1a1a1a" stroke-width="2"/><rect x="1202" y="773" width="30" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="1232" y1="780" x2="1252" y2="780" stroke="#1a1a1a" stroke-width="2"/><text x="1217.0" y="764" font-size="11" text-anchor="middle" fill="#555" font-weight="400">R70</text><text x="1217.0" y="806" font-size="12" text-anchor="middle" fill="#111" font-weight="700">4.7k</text><line x1="1252" y1="780" x2="1262" y2="780" stroke="#1a1a1a" stroke-width="2"/><rect x="1282" y="760" width="130" height="70" fill="#fffbe6" stroke="#1a1a1a" stroke-width="2.5"/><text x="1347.0" y="791.0" font-size="14" text-anchor="middle" fill="#111" font-weight="700">PC817</text><text x="1347.0" y="809.0" font-size="11" text-anchor="middle" fill="#555" font-weight="400">U70</text><line x1="1258" y1="782" x2="1282" y2="782" stroke="#1a1a1a" stroke-width="2"/><text x="1288" y="786" font-size="11" text-anchor="start" fill="#111" font-weight="400">A</text><line x1="1258" y1="808" x2="1282" y2="808" stroke="#1a1a1a" stroke-width="2"/><text x="1288" y="812" font-size="11" text-anchor="start" fill="#111" font-weight="400">K</text><line x1="1412" y1="782" x2="1436" y2="782" stroke="#1a1a1a" stroke-width="2"/><text x="1406" y="786" font-size="11" text-anchor="end" fill="#111" font-weight="400">C</text><line x1="1412" y1="808" x2="1436" y2="808" stroke="#1a1a1a" stroke-width="2"/><text x="1406" y="812" font-size="11" text-anchor="end" fill="#111" font-weight="400">E</text><line x1="1262" y1="780" x2="1258" y2="782" stroke="#1a1a1a" stroke-width="2"/><line x1="1258" y1="808" x2="1268" y2="808" stroke="#1a1a1a" stroke-width="2"/><text x="1228" y="830" font-size="11" text-anchor="start" fill="#0b5394" font-weight="700">→ IN COM</text><line x1="1436" y1="782" x2="1446" y2="782" stroke="#1a1a1a" stroke-width="2"/><polygon points="1446,782 1456,771 1542,771 1542,793 1456,793" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="1458" y="787" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO11 IN1</text><line x1="1436" y1="808" x2="1446" y2="808" stroke="#1a1a1a" stroke-width="2"/><line x1="1446" y1="808" x2="1446" y2="816" stroke="#1a1a1a" stroke-width="2"/><line x1="1432" y1="816" x2="1460" y2="816" stroke="#1a1a1a" stroke-width="3"/><line x1="1437" y1="821" x2="1455" y2="821" stroke="#1a1a1a" stroke-width="2"/><line x1="1442" y1="826" x2="1450" y2="826" stroke="#1a1a1a" stroke-width="2"/><text x="1000" y="880" font-size="12" text-anchor="start" fill="#555" font-weight="400">Same for IN2 (GPIO12) and IN3 (GPIO13); 10k pull-ups to +3V3 on the GPIO side.</text><text x="1000" y="904" font-size="12" text-anchor="start" fill="#555" font-weight="400">Jumper per input: "12 V = on" (IN COM to GND) or "contact to GND = on" (input fed from +12 V via</text><text x="1000" y="926" font-size="12" text-anchor="start" fill="#555" font-weight="400">R70, terminal pulls the LED cathode low). IN1 = Karman 3Gas+ white wire (12 V on alarm).</text><text x="30" y="1010" font-size="13" text-anchor="start" fill="#c0392b" font-weight="700">RJ12 pins 3 = LIN and 5 = GND are from the inetbox.py project (Combi 4 + CP plus, "inet ready"): confirm with a meter before the layout:</text><text x="30" y="1034" font-size="13" text-anchor="start" fill="#c0392b" font-weight="700">pin 3 idles near 12 V and flickers when the CP plus polls; pin 5 reads 0 V to the van ground. Use a 1:1 (not crossed) RJ12 cable.</text></svg>