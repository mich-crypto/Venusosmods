e="#0b5394" stroke-width="1.5"/><text x="1204" y="137" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">+3V3</text><rect x="60" y="620" width="190" height="70" fill="#eef6ee" stroke="#1f6b3b" stroke-width="2.5" rx="4"/><text x="155.0" y="612" font-size="13" text-anchor="middle" fill="#1f6b3b" font-weight="700">J1 USB-C (programming)</text><line x1="250" y1="640" x2="274" y2="640" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="644" font-size="11" text-anchor="start" fill="#111" font-weight="400">VBUS 5 V from PC</text><line x1="250" y1="670" x2="274" y2="670" stroke="#1a1a1a" stroke-width="2"/><text x="68" y="674" font-size="11" text-anchor="start" fill="#111" font-weight="400">GND GND</text><line x1="274" y1="640" x2="296" y2="640" stroke="#1a1a1a" stroke-width="2"/><line x1="322" y1="640" x2="344" y2="640" stroke="#1a1a1a" stroke-width="2"/><polygon points="296,630 296,650 322,640" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="322" y1="630" x2="322" y2="650" stroke="#1a1a1a" stroke-width="3"/><text x="309.0" y="624" font-size="11" text-anchor="middle" fill="#555" font-weight="400">D3</text><text x="309.0" y="666" font-size="12" text-anchor="middle" fill="#111" font-weight="700">SS14</text><line x1="344" y1="640" x2="364" y2="640" stroke="#1a1a1a" stroke-width="2"/><polygon points="364,640 374,629 516,629 516,651 374,651" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="376" y="645" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">+5V (bench power)</text><line x1="274" y1="670" x2="314" y2="670" stroke="#1a1a1a" stroke-width="2"/><line x1="300" y1="670" x2="328" y2="670" stroke="#1a1a1a" stroke-width="3"/><line x1="305" y1="675" x2="323" y2="675" stroke="#1a1a1a" stroke-width="2"/><line x1="310" y1="680" x2="318" y2="680" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="760" font-size="13" text-anchor="start" fill="#555" font-weight="400">USB powers the 5 V and 3.3 V rails on the bench (no 12 V needed to flash). D3 stops the 5 V from feeding back into the PC.</text><text x="900" y="560" font-size="15" text-anchor="start" fill="#111" font-weight="700">Leisure battery voltage (ST1 blue, before F1)</text><polygon points="900,600 910,589 996,589 996,611 910,611" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="912" y="605" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">ST1.6 +12V</text><line x1="996" y1="600" x2="1016" y2="600" stroke="#1a1a1a" stroke-width="2"/><rect x="1016" y="593" width="30" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="1046" y1="600" x2="1066" y2="600" stroke="#1a1a1a" stroke-width="2"/><text x="1031.0" y="584" font-size="11" text-anchor="middle" fill="#555" font-weight="400">R1</text><text x="1031.0" y="626" font-size="12" text-anchor="middle" fill="#111" font-weight="700">100k</text><circle cx="1066" cy="600" r="4" fill="#1a1a1a"/><line x1="1066" y1="600" x2="1066" y2="620" stroke="#1a1a1a" stroke-width="2"/><rect x="1059" y="620" width="14" height="30" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="1066" y1="650" x2="1066" y2="670" stroke="#1a1a1a" stroke-width="2"/><text x="1082" y="631.0" font-size="11" text-anchor="start" fill="#555" font-weight="400">R2</text><text x="1082" y="647.0" font-size="12" text-anchor="start" fill="#111" font-weight="700">22k</text><line x1="1052" y1="670" x2="1080" y2="670" stroke="#1a1a1a" stroke-width="3"/><line x1="1057" y1="675" x2="1075" y2="675" stroke="#1a1a1a" stroke-width="2"/><line x1="1062" y1="680" x2="1070" y2="680" stroke="#1a1a1a" stroke-width="2"/><line x1="1066" y1="600" x2="1126" y2="600" stroke="#1a1a1a" stroke-width="2"/><circle cx="1126" cy="600" r="4" fill="#1a1a1a"/><line x1="1126" y1="600" x2="1126" y2="631" stroke="#1a1a1a" stroke-width="2"/><line x1="1115" y1="631" x2="1137" y2="631" stroke="#1a1a1a" stroke-width="3"/><line x1="1115" y1="639" x2="1137" y2="639" stroke="#1a1a1a" stroke-width="3"/><line x1="1126" y1="639" x2="1126" y2="670" stroke="#1a1a1a" stroke-width="2"/><text x="1142" y="631.0" font-size="11" text-anchor="start" fill="#555" font-weight="400">C4</text><text x="1142" y="647.0" font-size="12" text-anchor="start" fill="#111" font-weight="700">100n</text><line x1="1112" y1="670" x2="1140" y2="670" stroke="#1a1a1a" stroke-width="3"/><line x1="1117" y1="675" x2="1135" y2="675" stroke="#1a1a1a" stroke-width="2"/><line x1="1122" y1="680" x2="1130" y2="680" stroke="#1a1a1a" stroke-width="2"/><line x1="1126" y1="600" x2="1166" y2="600" stroke="#1a1a1a" stroke-width="2"/><polygon points="1166,600 1176,589 1286,589 1286,611 1176,611" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="1178" y="605" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO10 (ADC1)</text><text x="900" y="800" font-size="13" text-anchor="start" fill="#555" font-weight="400">15 V → 2.70 V at the pin; 12.0 V → 2.16 V. Ratio 22/122 = 0.180.</text><text x="30" y="880" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Diodes D1/D2 OR the two supplies and block reverse polarity; D4 clamps van transients (load dump).</text><text x="30" y="904" font-size="13" text-anchor="start" fill="#333" font-weight="400">• F1 limits what the board draws from the EBL panel line (2.5 A PTC inside the EBL as well).</text><text x="30" y="928" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Heavy loads (2 relays, USB PD 30 W, RJ45 12 V) run from V12_AUX only, behind F2.</text><text x="30" y="952" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Idle draw ≈ 50 mA at 12 V (ESP32 Wi-Fi on); +≈35 mA per relay on.</text></svg>