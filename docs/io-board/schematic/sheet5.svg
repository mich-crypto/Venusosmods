1 944,783 906,783" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="908" y="777" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">SH2+</text><line x1="944" y1="772" x2="976" y2="772" stroke="#1a1a1a" stroke-width="2"/><polygon points="896,808 906,797 944,797 944,819 906,819" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="908" y="813" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">SH2−</text><line x1="944" y1="808" x2="976" y2="808" stroke="#1a1a1a" stroke-width="2"/><line x1="1244" y1="772" x2="1254" y2="772" stroke="#1a1a1a" stroke-width="2"/><polygon points="1254,772 1264,761 1390,761 1390,783 1264,783" fill="#e8f0fb" stroke="#0b5394" stroke-width="1.5"/><text x="1266" y="777" font-size="12" text-anchor="start" fill="#0b5394" font-weight="700">GPIO6 LIGHT2_ON</text><text x="30" y="980" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Two-way: OUTn NO → wall switch A, OUTn NC → wall switch B, switch middle tab → lamp +, lamp − → GND.</text><text x="30" y="1004" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Current sense: ≈ 30 mA or more through the shunt = lamp on, whichever way relay and wall switch stand → LIGHTn_ON.</text><text x="30" y="1028" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Without a wall switch: lamp + on OUTn NO only. Dry contact: cut JPn, then C/NO/NC are potential-free.</text><text x="30" y="1052" font-size="13" text-anchor="start" fill="#333" font-weight="400">• Relay stays put if the ESP32 restarts; V12_AUX comes from EBL Spare 4, so both lights work with the EBL main switch off.</text></svg>