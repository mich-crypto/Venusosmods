function voltageWindow(eff, live, cells) {
  const marks = [['MIN_CELL_VOLTAGE', 'empty (min)', 'var(--bad)'], ['FLOAT_CELL_VOLTAGE', 'float', 'var(--ok)'], ['MAX_CELL_VOLTAGE', 'full (max)', 'var(--accent)'], ['SOC_RESET_CELL_VOLTAGE', 'SOC reset', 'var(--warn)']]
    .map(([k, label, color]) => ({ k, label, color, v: parseFloat(eff(k)) })).filter(m => !isNaN(m.v)).sort((a, b) => a.v - b.v);
  const box = h('div', { class: 'gauge' });
  if (!marks.length) return box;
  sized(box, width => {
    clear(box);
    const L = 14, R = 14, lo = Math.min(2.6, marks[0].v - 0.1), hi = Math.max(3.75, marks[marks.length - 1].v + 0.1), X = v => L + (v - lo) / (hi - lo) * (width - L - R);
    const LH = cells ? 38 : 26, gap = 92;
    const slots = [{ up: true, row: 0, last: -999 }, { up: false, row: 0, last: -999 }, { up: true, row: 1, last: -999 }, { up: false, row: 1, last: -999 }];
    const placed = marks.map(m => { const x = X(m.v), sl = slots.find(sl => x - sl.last >= gap) || slots[0]; sl.last = x; return { m, x, sl }; });
    const upRows = Math.max(0, ...placed.filter(p => p.sl.up).map(p => p.sl.row + 1)), downRows = Math.max(0, ...placed.filter(p => !p.sl.up).map(p => p.sl.row + 1));
    const y = 12 + upRows * LH + 6, hgt = 16, H = y + hgt + 12 + downRows * LH;
    const root = svg('svg', { width, height: H, viewBox: '0 0 ' + width + ' ' + H });
    const mn = marks.find(m => m.k === 'MIN_CELL_VOLTAGE'), mx = marks.find(m => m.k === 'MAX_CELL_VOLTAGE');
    root.append(svg('rect', { x: L, y, width: width - L - R, height: hgt, rx: 8, fill: 'var(--soft)' }));
    if (mn && mx) root.append(svg('rect', { x: X(mn.v), y, width: Math.max(2, X(mx.v) - X(mn.v)), height: hgt, fill: 'var(--ok)', opacity: 0.28 }));
    if (live && live.min != null && live.max != null) root.append(svg('rect', { x: X(live.min), y: y - 4, width: Math.max(3, X(live.max) - X(live.min)), height: hgt + 8, rx: 4, fill: 'none', stroke: 'var(--warn)', 'stroke-width': 2 }));
    placed.forEach(({ m, x, sl }) => {
      root.append(svg('line', { x1: x, x2: x, y1: sl.up ? y - 4 - sl.row * LH : y, y2: sl.up ? y + hgt : y + hgt + 6 + sl.row * LH, stroke: m.color, 'stroke-width': sl.row ? 1 : 3, opacity: sl.row ? 0.5 : 1 }));
      const ty = sl.up ? y - 10 - sl.row * LH - (cells ? 26 : 14) : y + hgt + 18 + sl.row * LH;
      const anchor = x < 56 ? 'start' : (x > width - 56 ? 'end' : 'middle');
      const lines = [[m.label, 'fill:' + m.color + ';font-weight:600'], [m.v.toFixed(3) + ' V per cell', 'fill:var(--ink)']];
      if (cells) lines.push([(m.v * cells).toFixed(1) + ' V pack', 'fill:var(--muted)']);
      lines.forEach(([txt, st], k) => root.append(svg('text', { x, y: ty + k * 12, 'text-anchor': anchor, style: st }, txt)));
    });
    box.append(root);
  });
  return box;
}

function fmtDuration(s) {
  if (s == null) return '–';
  const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + ' d ' + hh + ' h' : (hh ? hh + ' h ' + m + ' min' : (m ? m + ' min' : Math.round(s) + ' s'));
}
function fmtBytes(b) {
  if (b == null) return '–';

  if (b >= 1e9) return (b / 1e9).toFixed(b >= 1e11 ? 0 : 1) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(0) + ' MB';
  return (b / 1e3).toFixed(0) + ' kB';
}
const pad2 = n => String(n).padStart(2, '0');
function fmtTime(t) { const d = new Date(t * 1000); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function delta(now, before, higherIsBetter, dec) {
  if (now == null || before == null) return null;

function icmpStrip(strip, good, warn, width) {
  const n = 48, w = width / n, root = svg('svg', { width, height: 34, viewBox: '0 0 ' + width + ' 34' });
  strip.slice(-n).forEach(([t, avg, loss], i) => {
    const x = (n - strip.slice(-n).length + i) * w;
    const color = avg == null || loss >= 100 ? 'var(--bad)' : (loss >= 5 || avg > warn ? 'var(--bad)' : (loss > 0 || avg > good ? 'var(--warn)' : 'var(--ok)'));
    const hgt = avg == null ? 34 : Math.max(4, Math.min(34, 6 + avg / Math.max(warn * 1.5, 1) * 28));
    root.append(svg('rect', { x: x + 0.5, y: 34 - hgt, width: Math.max(1, w - 1), height: hgt, fill: color, opacity: 0.85 }));
  });
  return root;
}

function barChart(o) {
  const box = h('div', { class: 'chart' }, h('h3', {}, o.title));
  const holder = h('div', {});
  box.append(holder);
  sized(holder, width => {
    clear(holder);
    const H = 170, L = 44, R = 8, T = 8, B = 22, n = o.values.length, max = Math.max(...o.values, 0.0001);
    const yt = niceTicks(0, max * 1.05, 3), top = Math.max(max * 1.05, yt.ticks[yt.ticks.length - 1] || 1);
    const Y = v => T + (1 - v / top) * (H - T - B), slot = (width - L - R) / n, bw = Math.max(1, slot * 0.7);
    const root = svg('svg', { width, height: H, viewBox: '0 0 ' + width + ' ' + H }), grid = svg('g', { class: 'grid' });
    yt.ticks.forEach(v => { grid.append(svg('line', { x1: L, x2: width - R, y1: Y(v), y2: Y(v) })); root.append(svg('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, v.toFixed(yt.dec))); });
    root.prepend(grid);
    o.values.forEach((v, i) => {
      const x = L + slot * i + (slot - bw) / 2;
      root.append(svg('rect', { x, y: Y(v), width: bw, height: Math.max(0, H - B - Y(v)), fill: 'var(--ink)', opacity: 0.85 }, svg('title', {}, o.labels[i] + ': ' + v.toFixed(o.dec) + ' ' + o.unit)));
    });
    const step = Math.max(1, Math.ceil(n / Math.floor((width - L) / 52)));
    o.labels.forEach((lb, i) => { if (i % step === 0) root.append(svg('text', { x: L + slot * i + slot / 2, y: H - 6, 'text-anchor': 'middle' }, lb)); });
    holder.append(root);
  });
  return box;
}

function timelineBand(d) {
  const box = h('div', { class: 'chart' }), cap = h('div', { class: 'muted', style: 'min-height:1.4em' }, 'Hover or touch the band for details.');
  sized(box, width => {
    clear(box);
    const H = 58, L = 0, span = Math.max(1, d.now - d.since), X = t => L + (Math.max(d.since, Math.min(d.now, t)) - d.since) / span * (width - L);
    const root = svg('svg', { width, height: H + 18, viewBox: '0 0 ' + width + ' ' + (H + 18) });
    const first = Math.max(d.since, d.first_seen || d.since);
    root.append(svg('rect', { x: 0, y: 0, width, height: H, fill: '#111' }), svg('rect', { x: X(first), y: 0, width: Math.max(0, width - X(first)), height: H, fill: '#1f3b27' }));
    const events = [];
    d.unreachable.forEach(u => events.push({ s: u.start, e: u.end, color: '#555', label: 'Pi could not reach the dish' }));
    d.outages.forEach(o => events.push({ s: o.start, e: o.start + Math.max(o.duration_s, 1), color: 'var(--bad)', label: 'Outage: ' + o.cause + ' (' + Math.round(o.duration_s) + ' s)' }));
    events.forEach(ev => root.append(svg('rect', { x: X(ev.s), y: 0, width: Math.max(2, X(ev.e) - X(ev.s)), height: H, fill: ev.color })));
    const ticks = width < 420 ? 3 : 6;
    for (let k = 0; k <= ticks; k++) { const t = d.since + span * k / ticks; root.append(svg('text', { x: Math.min(width - 2, Math.max(2, X(t))), y: H + 14, 'text-anchor': k === 0 ? 'start' : (k === ticks ? 'end' : 'middle') }, span > 2 * 86400 ? fmtTime(t).slice(5, 10) : fmtTime(t).slice(5))); }
    const overlay = svg('rect', { x: 0, y: 0, width, height: H, fill: 'transparent' });
    const show = ev => {
      const r = root.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left, t = d.since + px / width * span;
      const hit = events.find(x => t >= x.s - span / width * 2 && t <= x.e + span / width * 2);
      cap.textContent = fmtTime(t) + (hit ? ' · ' + hit.label : (t >= first ? ' · link up' : ' · not monitored'));
    };
    overlay.addEventListener('pointermove', show); overlay.addEventListener('touchstart', show, { passive: true });
    root.append(overlay);
    box.append(root);
  });
  return h('div', {}, box, cap, h('div', { class: 'keyrow' }, [['#1f3b27', 'link up'], ['var(--bad)', 'outage'], ['#555', 'dish not reachable'], ['#111', 'not monitored']].map(([c, l]) => h('span', {}, h('i', { style: 'background:' + c }), l))));
}

async function slLog(box) {
  const r = await api('/api/starlink_log?window=' + (S.slLogWindow || 86400));
  if (S.tab !== 'starlink' || S.slView !== 'log') return;
  if (!r.ok) { clear(box).append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the data')); return; }
  const d = r.data, st = d.stats, out = h('div', {});
  out.append(h('div', { class: 'row', style: 'margin-bottom:12px' }, h('b', {}, 'Outages'), h('span', { class: 'spacer' }),
    [[86400, '24 h'], [7 * 86400, '7 days'], [30 * 86400, '30 days']].map(([sec, label]) => h('button', { type: 'button', class: 'btn small' + ((S.slLogWindow || 86400) === sec ? ' primary' : ''), onclick: () => { S.slLogWindow = sec; slLog(box); } }, label))));
  out.append(h('div', { class: 'hero' }, metric('Availability', (st.availability * 100).toFixed(st.availability > 0.999 ? 2 : 1), '%', 'of ' + fmtDuration(st.observed_s - st.unreachable_s) + ' observed'),
    metric('Outages', String(st.count), '', 'in this period'), metric('Time down', fmtDuration(st.outage_s), '', st.unreachable_s > 60 ? 'plus ' + fmtDuration(st.unreachable_s) + ' the dish was not reachable' : '')));
  const causes = Object.entries(st.causes).sort((a, b) => b[1] - a[1]);
  if (causes.length) out.append(h('div', { class: 'row', style: 'margin:0 0 10px' }, causes.map(([c, s]) => h('span', { class: 'chip' }, c + ' ' + fmtDuration(s)))));
  out.append(h('div', { class: 'card' }, timelineBand(d)));
  out.append(h('h2', {}, 'Incidents'), h('div', { class: 'card', style: 'overflow-x:auto' }, d.outages.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Start', 'Duration', 'Cause'].map(x => h('th', {}, x)))),
    h('tbody', {}, d.outages.slice().reverse().map(o => h('tr', {}, h('td', {}, fmtTime(o.start)), h('td', {}, fmtDuration(o.duration_s)), h('td', {}, o.cause))))) : h('div', { class: 'muted' }, 'No outages recorded' + (d.first_seen ? ' since ' + fmtTime(d.first_seen) : '') + '. The dish keeps the last 15 minutes and this page reads them every minute.')));
  out.append(h('h2', {}, 'Public IP history'), h('div', { class: 'card', style: 'overflow-x:auto' }, d.wan.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Since', 'Address', 'Edge'].map(x => h('th', {}, x)))),
    h('tbody', {}, d.wan.slice().reverse().map(w => h('tr', {}, h('td', {}, fmtTime(w.time)), h('td', {}, w.ip), h('td', {}, [w.colo, w.loc].filter(Boolean).join(' · ') || '–'))))) : h('div', { class: 'muted' }, 'Nothing recorded yet (the address is checked every 5 minutes through Cloudflare).')));
  clear(box).append(out);
}

// -------------------------------------------------------------------- debug
async function slDebug(box) {
  if (!canEdit()) { clear(box).append(lockedNotice()); return; }
  const out = h('div', {}), tools = [['ping', 'Ping'], ['traceroute', 'Traceroute'], ['dns', 'DNS lookup'], ['http', 'HTTP check']];
  S.dbgTool = S.dbgTool || 'ping';
  const target = h('input', { type: 'text', value: S.dbgTarget || '', placeholder: 'host or address', autocapitalize: 'off', spellcheck: 'false', style: 'max-width:340px' });
  const result = h('pre', { class: 'rawbox', style: 'height:auto;min-height:6em;max-height:50vh' }, S.dbgOut || 'Pick a tool and a target. Results appear here.');
  const sel = h('select', { style: 'max-width:200px' }, tools.map(([v, l]) => h('option', { value: v, selected: v === S.dbgTool }, l)));
  const placeholder = () => { target.placeholder = sel.value === 'http' ? 'https://example.com' : 'host or address'; };
  sel.addEventListener('change', () => { S.dbgTool = sel.value; placeholder(); });
  placeholder();
  const run = async () => {
    S.dbgTarget = target.value.trim();
    result.textContent = 'running…';
    const r = await api('/api/debug_start', { tool: sel.value, target: S.dbgTarget });
    if (!r.ok) { result.textContent = r.data.error || 'could not start'; return; }
    for (let i = 0; i < 60; i++) {
      await new Promise(res => setTimeout(res, 800));
      if (S.tab !== 'starlink' || S.slView !== 'debug') return;
      const x = await api('/api/debug_result?job=' + r.data.job);
      if (x.ok) { S.dbgOut = x.data.out || '(no output)'; result.textContent = x.data.done ? S.dbgOut : (x.data.out || 'running…'); if (x.data.done) return; }
    }
  };
  target.addEventListener('keydown', ev => { if (ev.key === 'Enter') run(); });
  out.append(h('div', { class: 'card' }, h('h3', {}, 'Network tools'), h('div', { class: 'row' }, sel, target, h('button', { class: 'btn primary', onclick: run }, 'Run')),
    h('div', { class: 'row', style: 'margin:10px 0' }, [['ping', '192.168.100.1', 'Dish'], ['ping', '1.1.1.1', 'Cloudflare'], ['dns', 'example.com', 'DNS'], ['traceroute', '1.1.1.1', 'Route to 1.1.1.1']].map(([tool, tg, label]) =>
      h('button', { class: 'btn small', onclick: () => { sel.value = tool; S.dbgTool = tool; target.value = tg; placeholder(); run(); } }, label))), result));
  out.append(h('div', { class: 'muted' }, 'These run on the Pi, so they test the Pi\'s own connection. Only a plain host name, address or http(s) address is accepted.'));
  clear(box).append(out);
}

// ----------------------------------------------------------------- settings
async function slSettings(box) {
  if (!canEdit()) { clear(box).append(lockedNotice()); return; }
  const out = h('div', {});
  clear(box).append(out);
  out.append(await updatePanel());
  const r = await api('/api/driver_config');
  if (!r.ok) { out.append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read config.ini')); return; }
  S.forms = {};
  for (const kind of ['starlink', 'telegram']) {
    const section = r.data.sections.find(s => s.kind === kind) || r.data.optional.find(s => s.kind === kind);
    const { form, card, normal, adv } = formFor(section);
    S.forms[section.section] = form;
    normal.forEach(x => card.append(fieldRow(form, x, section)));
    if (adv.length) card.append(h('details', { class: 'adv' }, h('summary', {}, 'Advanced'), adv.map(x => fieldRow(form, x, section))));
    if (kind === 'telegram') card.append(h('div', { class: 'row' }, h('button', { class: 'btn small', onclick: async () => { const x = await api('/api/telegram_test', {}); toast(x.ok ? x.data.message : x.data.error, !x.ok); } }, 'Send a test message')));
    out.append(card);
  }
  out.append(h('div', { class: 'muted' }, 'Saving restarts this page (a few seconds): these settings are read when it starts. Settings that are not in config.ini use the defaults shown.'));
}

async function updatePanel() {
  const card = h('div', { class: 'card' }, h('h3', {}, 'Software update'));
  const body = h('div', {});
  card.append(body);
  const draw = async (refresh) => {
    const r = await api('/api/update_check' + (refresh ? '?refresh=1' : ''));
    clear(body);
    if (!r.ok) { body.append(h('div', { class: 'muted' }, r.data.error || 'Could not check')); return; }
    const d = r.data;
    body.append(h('div', { class: 'stats' }, stat('Installed', d.installed ? d.installed.slice(0, 7) : 'unknown', d.installed ? '' : 'updated by update.sh from now on', true),
      stat('Latest', d.latest ? d.latest.slice(0, 7) : (d.checking ? 'checking…' : '–'), d.date ? d.date.slice(0, 10) : '', true)));
    if (d.message) body.append(h('div', { class: 'muted' }, 'Latest change: ' + d.message));
    if (d.error) body.append(h('div', { class: 'muted' }, d.error));
    body.append(h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn small', onclick: () => draw(true) }, 'Check now'),
      h('button', { class: 'btn small' + (d.available ? ' primary' : ''), disabled: d.running, onclick: () => confirmThen('Download the latest version and restart the services?', async () => {
        const x = await api('/api/update_run', {});
        toast(x.ok ? x.data.message : x.data.error, !x.ok);
        if (x.ok) watchUpdate(body);
      }) }, d.available ? 'Update now' : 'Reinstall latest'), d.available ? h('span', { class: 'chip warn' }, 'update available') : (d.installed && d.latest ? h('span', { class: 'chip ok' }, 'up to date') : null)));
    if (d.checking) setTimeout(() => { if (S.tab === 'starlink' && S.slView === 'settings') draw(false); }, 2500);
  };
  await draw(false);
  return card;
}

async function watchUpdate(body) {
  const pre = h('pre', { class: 'rawbox', style: 'height:auto;max-height:30vh;margin-top:8px' }, 'starting…');
  body.append(pre);
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 2000));
    const x = await api('/api/update_log');
    if (x.ok) { pre.textContent = x.data.text || '(no output yet)'; if (!x.data.running) { toast('Update finished. Reload the page.'); return; } }
    else if (x.status === 0) pre.textContent += '\n(the page is restarting…)';
  }
}

function starlinkCard(sl) {
  if (!sl || !sl.enabled || !sl.state) return null;
  const good = sl.state === 'Connected';
  return h('div', { class: 'card' }, h('h3', {}, 'Starlink ', h('span', { class: 'chip ' + (good ? 'ok' : 'bad') }, sl.state), sl.throttled ? h('span', { class: 'chip warn' }, 'throttled: ' + sl.limit) : null),
    h('div', { class: 'big' }, fmtMbps(sl.down_bps), h('small', {}, ' Mbit/s down')),
    sl.quality == null ? null : h('div', { class: 'muted' }, 'Connection quality ' + sl.quality + ' % · ' + sl.quality_label),
    h('div', { class: 'muted' }, 'up ' + fmtMbps(sl.up_bps) + ' · ping ' + (sl.latency_ms == null ? '–' : sl.latency_ms.toFixed(0)) + ' ms · obstructed ' + (sl.obstructed_pct == null ? '–' : sl.obstructed_pct.toFixed(1)) + ' %'),
    (sl.alerts || []).length ? h('div', { class: 'muted' }, sl.alerts.join(', ')) : null);
}

// ------------------------------------------------------------- raw data
const RAW_SOURCES = [['gas', 'Gas (Mopeka)'], ['fridge', 'Fridge'], ['water', 'Water (ESP32)']];
const FRIDGE_BYTES = { 0: 'locked', 1: 'power on', 2: 'eco mode', 3: 'battery saver', 4: 'left set point', 5: 'left highest set point',
  6: 'left lowest set point', 9: 'unit (0 °C, 1 °F)', 14: 'left temperature', 15: 'battery % (127 = none)', 16: 'supply volts', 17: 'supply volts, tenths',
  18: 'right set point', 19: 'right highest set point', 20: 'right lowest set point', 26: 'right temperature', 27: 'running status', 28: 'model' };

async function tabRaw(main) {
  stopBattery();
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  S.rawSource = S.rawSource || 'gas';
  main.append(h('div', { class: 'pills', role: 'group' }, RAW_SOURCES.map(([id, label]) =>
    h('button', { type: 'button', 'aria-pressed': S.rawSource === id, onclick: () => { S.rawSource = id; renderTab(); } }, label))));
  const box = h('div', {});
  main.append(box);
  await rawView(box);
  S.rawTimer = setInterval(() => { if (!document.hidden && S.tab === 'raw' && !S.rawPaused && !$('#dlg').open) rawView(box); }, 3000);
}

function rawLine(text) {
  const m = /^(\S+ \S+) (\S+)\s+(.*)$/.exec(text);
  if (!m) return h('div', {}, text);
  return h('div', {}, h('span', { class: 'ts' }, m[1].slice(11) + ' '), h('span', { class: 'k k-' + m[2] }, m[2].padEnd(6)), ' ', m[3]);
}

async function rawView(box) {
  const r = await api('/api/rawlog?source=' + S.rawSource + '&lines=300');
  if (S.tab !== 'raw') return;
  const out = h('div', {});
  if (!r.ok) { clear(box).append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the log')); return; }
  const lines = r.data.lines, old = $('.rawbox'), stick = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 30;
  const note = { gas: 'Every Mopeka advertisement of your sensor: the raw bytes (data=), what they decode to, and the level that was published.',
    fridge: 'What the Pi sends to the fridge (tx) and what comes back (rx), with the decoded status. A status payload is a row of bytes; the table below names them.',
    water: 'Every new ESP32 advertisement with its raw bytes and what they decode to.' }[S.rawSource];
  out.append(h('div', { class: 'row', style: 'margin-bottom:8px' }, h('div', { class: 'muted' }, note), h('span', { class: 'spacer' }),
    h('button', { type: 'button', class: 'btn small', onclick: () => { S.rawPaused = !S.rawPaused; renderTab(); } }, S.rawPaused ? 'Resume' : 'Pause'),
    h('button', { type: 'button', class: 'btn small', onclick: () => copyText(lines.join('\n')) }, 'Copy'),
    h('button', { type: 'button', class: 'btn small danger', disabled: !canEdit(), onclick: async () => { await api('/api/rawlog_clear', { source: S.rawSource }); rawView(box); } }, 'Clear')));
  const view = h('div', { class: 'rawbox' }, lines.length ? lines.map(rawLine) : h('div', { class: 'muted' }, 'Nothing logged yet. The log lives in ' + r.data.dir + ' on the Pi (lost at a reboot) and fills as the sensor sends data. Update the drivers and restart them if it stays empty.'));
  out.append(view);
  if (S.rawSource === 'fridge') {
    const last = lines.slice().reverse().map(l => /payload=([0-9a-f]+)/.exec(l)).find(Boolean);
    if (last) {
      const bytes = last[1].match(/../g).map(x => parseInt(x, 16));
      out.append(h('details', { class: 'group', open: true, style: 'margin-top:12px' }, h('summary', {}, 'Last status payload, byte by byte'),
        h('div', { class: 'body', style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, ['Byte', 'Hex', 'Value', 'Meaning'].map(x => h('th', {}, x)))),
          h('tbody', {}, bytes.map((b, i) => h('tr', {}, h('td', {}, i), h('td', {}, h('code', {}, b.toString(16).padStart(2, '0'))), h('td', {}, b > 127 ? b + ' (' + (b - 256) + ')' : b), h('td', {}, FRIDGE_BYTES[i] || ''))))))));
    }
  }
  clear(box).append(out);
  const nv = $('.rawbox');
  if (nv && stick) nv.scrollTop = nv.scrollHeight;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); return; } catch (e) { /* plain http: not allowed */ }
  const ta = h('textarea', { style: 'position:fixed;left:-1000px' }, text);
  document.body.append(ta); ta.value = text; ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
  ta.remove();
  toast(ok ? 'Copied' : 'Copy is blocked here: press and hold the text to select it', !ok);
}

// ------------------------------------------------------------ files & logs
async function rawEditor(which, title) {
  const r = await api('/api/raw?file=' + which);
  const card = h('div', { class: 'card' }, h('h3', {}, title));
  if (!r.ok) { card.append(h('div', { class: 'muted' }, r.data.error || 'not available')); return card; }
  const ta = h('textarea', { spellcheck: 'false', disabled: !canEdit() }, r.data.text);
  const errs = h('div', { class: 'err' });
  ta.value = r.data.text;
  ta.addEventListener('input', () => ta.classList.toggle('changed', ta.value !== r.data.text));
  card.append(h('div', { class: 'muted' }, r.data.path + ' (the previous version is kept as .bak)'), ta, errs,
    h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn primary', disabled: !canEdit(), onclick: async () => {
      const w = await api('/api/raw', { file: which, text: ta.value });
      clear(errs);
      if (!w.ok) { errs.append(w.data.error || 'Not saved', ...Object.entries(w.data.errors || {}).map(([k, m]) => h('div', {}, k + ': ' + m))); toast('Not saved', true); }
      else { toast('Saved. Restart the driver to apply it.'); r.data.text = ta.value; ta.classList.remove('changed'); }
    } }, 'Save file')));
  return card;
}

async function tabFiles(main) {
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  main.append(h('div', { class: 'banner' }, 'For experts: the raw files. A file is checked before it is saved; a wrong value is refused.'));
  main.append(await rawEditor('driver', 'Drivers: config.ini'));
  if (S.state.serialbattery) main.append(await rawEditor('serialbattery', 'dbus-serialbattery: config.ini'));
  main.append(h('h2', {}, 'Logs'));
  main.append(h('div', { class: 'row' }, (S.state.services || []).map(s => h('button', { class: 'btn small', onclick: () => showLog(s.name) }, s.name)),
    S.state.serialbattery ? h('button', { class: 'btn small', onclick: () => showLog('dbus-serialbattery') }, 'dbus-serialbattery') : null));
}

// ------------------------------------------------------------------- boot
async function refreshState() {
  const r = await api('/api/state');
  if (r.ok) { S.state = r.data; renderLock(); }
  return r;
}

async function firstRunGuide() {
  if (!S.state || !S.state.authed) return;
  let seen = false;
  try { seen = localStorage.getItem('wizSeen') === '1'; } catch (e) { /* private window: ask every time */ }
  if (seen) return;
  const r = await api('/api/setup');
  if (r.ok && r.data.first_run) { try { localStorage.setItem('wizSeen', '1'); } catch (e) { /* ignore */ } openSetup(); }
}

async function boot() {
  renderTabs();
  const r = await refreshState();
  if (!r.ok) { $('#main').append(h('div', { class: 'banner bad' }, r.data.error || 'The Pi does not answer')); return; }
  await renderTab();
  firstRunGuide();
  setInterval(async () => {
    if (document.hidden) return;
    await refreshState();
    if (S.tab === 'overview' && !$('#dlg').open) { const main = clear($('#main')); await tabOverview(main); }
  }, 5000);
}
boot();
</script>
