<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Venus settings</title>
<style>
/* Black-and-white dashboard: white on black, hairline borders, small spaced capitals for labels;
   colour only for status (green good, amber degraded, red down). */
:root {
  color-scheme:dark;
  --bg:#000; --card:#050505; --ink:#fff; --muted:#a0a0a0; --faint:#6e6e6e; --line:#2b2b2b; --line-soft:#1a1a1a; --soft:#121212;
  --accent:#fff; --accent-ink:#000; --ok:#30d158; --warn:#ffb020; --bad:#ff3b30;
  --ok-bg:rgba(48,209,88,.10); --warn-bg:rgba(255,176,32,.10); --bad-bg:rgba(255,59,48,.12); --code:#0c0c0c;
  --font:"D-DIN","DIN Alternate","Bahnschrift","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
* { box-sizing:border-box; }
html { font-size:16px; -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.4; }
header { background:rgba(0,0,0,.82); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.bar { max-width:1100px; margin:0 auto; padding:12px 16px 6px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.bar h1 { font-size:.95rem; margin:0; font-weight:700; letter-spacing:.42em; text-transform:uppercase; }
.bar .sub { color:var(--faint); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
.spacer { flex:1; }
nav { max-width:1100px; margin:0 auto; padding:0 10px; display:flex; gap:2px; overflow-x:auto; }
nav button { background:none; border:0; border-bottom:2px solid transparent; padding:10px 12px; font:inherit; font-size:.72rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted); cursor:pointer; white-space:nowrap; }
nav button:hover { color:var(--ink); }
nav button[aria-selected=true] { color:var(--ink); border-color:var(--ink); }
main { max-width:1100px; margin:0 auto; padding:18px 16px; padding-bottom:110px; }
h2 { font-size:.72rem; margin:28px 0 10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
h2:first-child { margin-top:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px 18px; margin-bottom:12px; }
.grid .card { margin:0; }
.card h3, .chart h3 { font-size:.7rem; margin:0 0 6px; display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); }
.big { font-size:2.2rem; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
.big small { font-size:.9rem; font-weight:400; color:var(--muted); }
.muted { color:var(--muted); font-size:.85rem; overflow-wrap:anywhere; }
.chip { display:inline-block; font-size:.66rem; font-weight:600; padding:2px 9px; border-radius:99px; border:1px solid var(--line);
  color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
.chip.ok { color:var(--ok); border-color:var(--ok); } .chip.warn { color:var(--warn); border-color:var(--warn); }
.chip.bad { color:var(--bad); border-color:var(--bad); }
.bar-level { height:3px; background:var(--line); overflow:hidden; margin:10px 0 8px; }
.bar-level > i { display:block; height:100%; background:var(--ink); }
button, select, input, textarea { font:inherit; color:inherit; }
.btn { background:transparent; border:1px solid #3d3d3d; border-radius:3px; padding:9px 14px; cursor:pointer; min-height:42px; }
.btn:hover:not(:disabled) { border-color:var(--ink); }
.btn.primary { background:var(--ink); border-color:var(--ink); color:#000; font-weight:600; }
.btn.danger { color:var(--bad); border-color:#5a2420; }
.btn.small { padding:5px 10px; min-height:34px; font-size:.85rem; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
table { width:100%; border-collapse:collapse; }
td, th { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line-soft); font-size:.92rem; }
tbody tr:hover td { background:#0c0c0c; }
th { color:var(--faint); font-weight:600; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; }
.field { margin:0 0 16px; }
.field > label, .field > .lbl { display:block; font-weight:600; margin-bottom:5px; font-size:.78rem; letter-spacing:.06em; }
.field .help { color:var(--muted); font-size:.82rem; margin-top:4px; }
.field .err { color:var(--bad); font-size:.82rem; margin-top:3px; }
input[type=text], input[type=number], input[type=password], input[type=search], select, textarea {
  width:100%; max-width:520px; padding:9px 11px; min-height:42px; border:1px solid var(--line); border-radius:3px; background:#0a0a0a; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ink); }
input.changed, select.changed, textarea.changed { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
input.bad, select.bad { border-color:var(--bad); }
.with-unit { display:flex; gap:8px; align-items:center; max-width:520px; }
.with-unit input { max-width:none; } .unit { color:var(--muted); min-width:24px; }
textarea { max-width:100%; box-sizing:border-box; min-height:300px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; }
details.adv { margin:6px 0 0; } details.adv > summary { cursor:pointer; color:var(--muted); padding:6px 0; }
.switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
.switch input { width:46px; height:26px; appearance:none; -webkit-appearance:none; background:#262626; border:1px solid var(--line);
  border-radius:99px; position:relative; transition:.15s; margin:0; cursor:pointer; flex:none; }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#888; transition:.15s; }
.switch input:checked { background:var(--ink); border-color:var(--ink); } .switch input:checked::after { left:23px; background:#000; }
.switch input:disabled { opacity:.4; }
.entry { padding:12px 0; border-bottom:1px solid var(--line-soft); }
.entry:last-child { border-bottom:0; }
.entry .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
.entry .name { font-weight:600; } .entry code { font-size:.72rem; color:var(--muted); background:var(--code); padding:1px 6px; border-radius:3px; border:1px solid var(--line-soft); }
.entry pre { white-space:pre-wrap; background:var(--code); border:1px solid var(--line-soft); border-radius:3px; padding:10px 12px; font-size:.8rem;
  margin:8px 0 0; font-family:ui-monospace,Menlo,Consolas,monospace; overflow-x:auto; }
.entry.modified .name::after { content:" \25CF"; color:var(--ink); }
.entry .meta { color:var(--muted); font-size:.8rem; margin-top:5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.link { background:none; border:0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--faint); cursor:pointer; padding:0; font-size:inherit; }
a { color:var(--ink); text-underline-offset:3px; }
details.group { background:var(--card); border:1px solid var(--line); border-radius:4px; margin-bottom:10px; }
details.group > summary { cursor:pointer; padding:14px 16px; font-weight:600; list-style:none; display:flex; gap:8px; align-items:center;
  font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; }
details.group > summary::-webkit-details-marker { display:none; }
details.group > summary::before { content:"\25B8"; color:var(--muted); transition:.15s; }
details.group[open] > summary::before { transform:rotate(90deg); }
details.group > .body { padding:0 16px 8px; }
.savebar { position:fixed; left:0; right:0; bottom:0; background:rgba(0,0,0,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:10px 16px; z-index:6; }
.savebar .in { max-width:1100px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.banner { border:1px solid var(--line); border-left:3px solid var(--muted); border-radius:3px; padding:12px 14px; margin:0 0 14px; background:var(--card); }
.banner.warn { border-left-color:var(--warn); } .banner.ok { border-left-color:var(--ok); } .banner.bad { border-left-color:var(--bad); }
#toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:20; max-width:90vw; background:var(--ink); color:#000;
  padding:10px 16px; border-radius:3px; opacity:0; pointer-events:none; transition:opacity .2s; font-size:.92rem; }
#toast.show { opacity:1; } #toast.bad { background:var(--bad); color:#fff; }
dialog { border:1px solid var(--line); border-radius:4px; background:#080808; color:var(--ink); max-width:min(900px,94vw); width:100%; padding:16px; }
dialog::backdrop { background:rgba(0,0,0,.7); }
dialog pre { background:var(--code); border:1px solid var(--line-soft); border-radius:3px; padding:10px; max-height:60vh; overflow:auto; font-size:.8rem;
  white-space:pre-wrap; word-break:break-word; }
.cells { display:flex; align-items:flex-end; gap:3px; height:44px; margin-top:8px; }
.cells i { flex:1; background:var(--ink); min-height:3px; }
.pills { display:flex; gap:0; margin:0 0 16px; flex-wrap:wrap; border:1px solid var(--line); border-radius:3px; width:max-content; max-width:100%; }
.pills button { background:none; border:0; border-right:1px solid var(--line); padding:8px 16px; cursor:pointer; font-size:.72rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); }
.pills button:last-child { border-right:0; }
.pills button[aria-pressed=true] { background:var(--ink); color:#000; font-weight:700; }
/* hero numbers and hairline stat grids, as in Stardashy */
.hero { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:4px; margin-bottom:12px; }
.hero .metric { padding:22px 20px; border-right:1px solid var(--line); min-width:0; }
.hero .metric:last-child { border-right:0; }
.metric .label, .tile .k, .stat .k { color:var(--muted); font-size:.64rem; letter-spacing:.18em; text-transform:uppercase; font-weight:600; }
.metric .num { font-size:clamp(40px,7vw,76px); font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin:6px 0 2px; }
.metric .num small { font-size:.28em; font-weight:400; color:var(--muted); letter-spacing:.1em; margin-left:6px; text-transform:uppercase; }
.metric .sub { color:var(--muted); font-size:.8rem; }
.tiles, .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:4px; overflow:hidden; margin-bottom:12px; }
.tile, .stat { background:var(--bg); padding:14px 16px; min-width:0; }
.tile .v, .stat .v { font-size:1.6rem; font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.tile .v small, .stat .v small { font-size:.75rem; font-weight:400; color:var(--muted); }
.tile .s, .stat .s { color:var(--muted); font-size:.78rem; }
.metaline { color:var(--muted); font-size:.8rem; margin:2px 0 14px; display:flex; flex-wrap:wrap; gap:4px 18px; }
.metaline b { color:var(--ink); font-weight:600; }
.live { display:inline-block; font-size:.6rem; letter-spacing:.16em; padding:1px 7px; border:1px solid var(--ok); color:var(--ok); border-radius:99px; }
.live::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-right:5px; animation:pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity:.25; } }
.find { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line-soft); }
.find:last-child { border-bottom:0; } .dot { flex:none; width:9px; height:9px; border-radius:50%; margin-top:7px; background:var(--muted); }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.chart { position:relative; } .chart svg { display:block; width:100%; }
.chart .legend { display:flex; gap:4px 10px; flex-wrap:wrap; margin:4px 0 2px; font-size:.78rem; }
.chart .legend button { background:none; border:0; padding:2px 4px; cursor:pointer; color:var(--ink); display:inline-flex; gap:5px; align-items:center; }
.chart .legend button.off { opacity:.35; text-decoration:line-through; }
.chart .legend i { width:10px; height:3px; border-radius:2px; display:inline-block; }
.chart .tt { position:absolute; top:0; pointer-events:none; background:#0a0a0a; border:1px solid #444; border-radius:3px; padding:6px 8px;
  font-size:.76rem; white-space:nowrap; z-index:2; }
.chart text, .gauge text { fill:var(--muted); font-size:11px; }
.chart .grid line, .gauge .grid line { stroke:var(--line-soft); }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
.two .card { margin:0; }
.pill-on { color:var(--ok); border-color:var(--ok); } .pill-off { color:var(--bad); border-color:var(--bad); }
td code { overflow-wrap:anywhere; }
table.kv td:first-child { color:var(--muted); width:55%; } table.kv code { font-size:.76rem; }
#main .rawbox { background:var(--code); border:1px solid var(--line-soft); border-radius:3px; padding:10px; font:.76rem/1.45 ui-monospace,Menlo,Consolas,monospace;
  height:52vh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
.rawbox .ts { color:var(--faint); } .rawbox .k { font-weight:700; } .k-tx { color:#fff; } .k-rx { color:var(--ok); }
.k-error { color:var(--bad); } .k-status { color:var(--warn); } .k-adv { color:var(--ok); }
@media (max-width:700px) {
  .hero { grid-template-columns:1fr; } .hero .metric { border-right:0; border-bottom:1px solid var(--line); } .hero .metric:last-child { border-bottom:0; }
  .tile .v, .stat .v { font-size:1.3rem; } .two { grid-template-columns:1fr; } .big { font-size:1.8rem; } main { padding:12px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Venus OS mods</h1>
    <span class="sub" id="hostline"></span>
    <span class="spacer"></span>
    <span id="lockchip"></span>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>
<div class="savebar" id="savebar" hidden><div class="in" id="saveinner"></div></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
// ---------------------------------------------------------------- helpers
const S = { tab: 'overview', state: null, driver: null, sb: null, forms: {}, logTimer: null, sbCtl: {} };
const TABS = [['overview', 'Overview'], ['fridge', 'Fridge'], ['gas', 'Gas'], ['water', 'Water'],
              ['battery', 'Battery'], ['starlink', 'Starlink'], ['raw', 'Raw data'], ['files', 'Files & logs']];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (['checked', 'disabled', 'selected', 'open', 'hidden'].includes(k)) el[k] = !!v;
    else el.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);   // aria-pressed="true", not an empty attribute
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (s, el) => (el || document).querySelector(s);
const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, bad ? 6000 : 3000);
}

async function api(path, form) {
  const opts = { headers: { 'X-Requested-With': 'venussettings' } };
  if (form) {
    opts.method = 'POST';
    opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
    opts.body = new URLSearchParams(form).toString();
  }
  let r, data = {};
  try { r = await fetch(path, opts); } catch (e) { return { status: 0, ok: false, data: { error: 'No connection to the Pi' } }; }
  try { data = await r.json(); } catch (e) { /* not json */ }
  if (r.status === 401) S.locked = true;
  return { status: r.status, ok: r.ok && data.ok !== false, data };
}

const num = (v, d) => (v === null || v === undefined || isNaN(v)) ? '–' : Number(v).toFixed(d === undefined ? 1 : d);
const val = (dev, path) => dev && dev.values ? dev.values[path] : undefined;
const canEdit = () => !!(S.state && S.state.authed);

function ago(sec) {
  if (sec === null || sec === undefined) return '';
  if (sec < 90) return sec + ' s';
  if (sec < 5400) return Math.round(sec / 60) + ' min';
  if (sec < 172800) return Math.round(sec / 3600) + ' h';
  return Math.round(sec / 86400) + ' days';
}

// ------------------------------------------------------------- shell, tabs
function renderTabs() {
  const nav = clear($('#tabs'));
  for (const [id, label] of TABS) {
    nav.append(h('button', { role: 'tab', 'aria-selected': S.tab === id, onclick: () => selectTab(id) }, label));
  }
}

function renderLock() {
  const st = S.state, box = clear($('#lockchip'));
  if (!st) return;
  if (!st.password_set) {
    box.append(h('span', { class: 'chip warn', title: 'Set a password in config.ini ([web] password) to be able to change settings' }, 'Read-only'));
  } else if (st.authed) {
    box.append(h('span', { class: 'chip ok' }, 'Unlocked'));
  } else {
    box.append(h('a', { class: 'btn primary small', href: '/unlock' }, 'Unlock to edit'));
  }
  $('#hostline').textContent = [st.host, st.venus && 'Venus OS ' + st.venus].filter(Boolean).join(' · ');
}

async function selectTab(id) {
  S.tab = id;
  stopLogs();
  stopBattery();
  hideSaveBar();
  renderTabs();
  await renderTab();
}

function lockedNotice() {
  const st = S.state;
  return h('div', { class: 'banner warn' },
    st && !st.password_set
      ? 'No password is set, so this page is read-only. Set one with: nano /data/shared_drivers/config.ini  ([web] password = ...) and restart the page.'
      : ['Unlock the page to change settings. ', h('a', { href: '/unlock' }, 'Unlock')]);
}

async function renderTab() {
  hideSaveBar();                                   // a redraw (save, discard) starts with no pending changes
  const main = clear($('#main'));
  const f = { overview: tabOverview, fridge: () => tabDriver('fridge'), gas: () => tabDriver('mopeka'),
              water: () => tabDriver('esp32'), battery: tabBattery, starlink: tabStarlink, raw: tabRaw, files: tabFiles }[S.tab];
  await f(main);
}

// ---------------------------------------------------------------- overview
function statusChip(dev) {
  const c = val(dev, '/Connected');
  return h('span', { class: 'chip ' + (c === 1 ? 'ok' : 'bad') }, c === 1 ? 'connected' : 'not connected');
}

function levelBar(pct) {
  return h('div', { class: 'bar-level' }, h('i', { style: 'width:' + Math.max(0, Math.min(100, pct || 0)) + '%' }));
}

function deviceCard(d) {
  const v = d.values, name = v['/CustomName'] || v['/ProductName'] || d.service;
  if (d.kind === 'tank') {
    const gas = '/Mopeka/DistanceMm' in v;
    const rem = v['/Remaining'] === null || v['/Remaining'] === undefined ? '' : num(v['/Remaining'] * 1000, 1) + ' L of ' + num(v['/Capacity'] * 1000, 0) + ' L';
    return h('div', { class: 'card' },
      h('h3', {}, name, ' ', statusChip(d)),
      h('div', { class: 'big' }, num(v['/Level'], 0), h('small', {}, ' %')), levelBar(v['/Level']),
      h('div', { class: 'muted' }, rem),
      gas ? h('div', { class: 'muted' }, 'Sensor reads ' + num(v['/Mopeka/DistanceMm'], 0) + ' mm · ' + num(v['/Temperature'], 0) + ' °C · battery ' + num(v['/BatteryVoltage'], 2) + ' V · ' + (v['/Rssi'] || '–') + ' dBm')
          : h('div', { class: 'muted' }, 'Water height ' + num(v['/Hydro/HeightMm'], 0) + ' mm' +
              (v['/Hydro/Filling'] ? ' · filling' : '') + (v['/Hydro/Draining'] ? ' · draining' : '') + (v['/Hydro/Sloshing'] ? ' · sloshing' : '')));
  }
  if (d.kind === 'temperature') {
    const fridge = '/Fridge/PoweredOn' in v;
    return h('div', { class: 'card' },
      h('h3', {}, name, ' ', statusChip(d)),
      h('div', { class: 'big' }, num(v['/Temperature'], 1), h('small', {}, ' °C')),
      fridge ? h('div', { class: 'muted' }, 'Set to ' + num(v['/Fridge/TargetTemperature'], 0) + ' °C · ' + (v['/Fridge/PoweredOn'] ? 'on' : 'off') +
              (v['/Fridge/EcoMode'] ? ' · eco' : '') + ' · supply ' + num(v['/Fridge/SupplyVoltage'], 1) + ' V') : null);
  }
  return null;
}

function batteryCard(d) {
  const v = d.values;
  return h('div', { class: 'card' },
    h('h3', {}, v['/CustomName'] || v['/ProductName'] || d.service, ' ', statusChip(d)),
    h('div', { class: 'big' }, num(v['/Soc'], 0), h('small', {}, ' %')), levelBar(v['/Soc']),
    h('div', { class: 'muted' }, num(v['/Dc/0/Voltage'], 2) + ' V · ' + num(v['/Dc/0/Current'], 1) + ' A · ' +
      num(v['/Dc/0/Power'], 0) + ' W · ' + num(v['/Dc/0/Temperature'], 1) + ' °C'));
}

async function tabOverview(main) {
  const st = S.state;
  const cards = (st.devices || []).map(deviceCard).filter(Boolean).concat((st.batteries || []).map(batteryCard), [starlinkCard(st.starlink)]).filter(Boolean);
  main.append(h('h2', {}, 'Now'));
  main.append(cards.length ? h('div', { class: 'grid' }, cards) :

  const rows = (st.services || []).map(s => {

  });
  main.append(h('div', { class: 'card' }, h('table', {}, h('tr', {}, h('th', {}, 'Driver'), h('th', {}, 'Status'), h('th', {}, '')), rows)));

    main.append(h('div', { class: 'card row' }, h('div', {}, h('b', {}, 'dbus-serialbattery'), h('div', { class: 'muted' }, 'Battery driver (JK BMS etc.), settings on the Battery tab')),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', onclick: () => showLog('dbus-serialbattery') }, 'Log'),
      h('button', { class: 'btn small', disabled: !canEdit(), onclick: () => confirmThen('Restart dbus-serialbattery?', () => post('/api/restart', { target: 'serialbattery' })) }, 'Restart')));

    h('span', { class: 'spacer' }),
    h('button', { class: 'btn danger', disabled: !canEdit(), onclick: () => confirmThen('Reboot the Pi now? The page will be unavailable for about a minute.', () => post('/api/reboot', {})) }, 'Reboot')));
}

async function post(path, form, quiet) {
  const r = await api(path, form);
  if (!quiet) toast(r.data.message || r.data.error || (r.ok ? 'Done' : 'Failed'), !r.ok);
  if (r.status === 401) { renderLock(); }
  return r;
}

function confirmThen(text, fn) { if (window.confirm(text)) return fn(); }

async function svcRestart(name) { await post('/api/restart', { target: name }); await refreshState(); }
async function svcToggle(s) {
  if (s.enabled && !window.confirm('Turn off ' + s.name + '? Its device disappears from Venus OS.')) return;
  await post('/api/service', { name: s.name, action: s.enabled ? 'disable' : 'enable' });
  await refreshState();
}

// -------------------------------------------------------------------- logs
function stopLogs() { clearInterval(S.logTimer); S.logTimer = null; }
async function showLog(name) {
  const dlg = $('#dlg'), pre = h('pre', {}, 'loading…');
  const load = async () => {
    const r = await api('/api/log?service=' + encodeURIComponent(name));
    pre.textContent = r.ok ? (r.data.lines.join('\n') || '(empty)') : (r.data.error || 'could not read the log');
    pre.scrollTop = pre.scrollHeight;
  };
  clear(dlg).append(h('div', { class: 'row' }, h('b', {}, 'Log: ' + name), h('span', { class: 'spacer' }),
    h('button', { class: 'btn small', onclick: load }, 'Refresh'),
    h('button', { class: 'btn small', onclick: () => dlg.close() }, 'Close')), pre);

// ------------------------------------------------------------ driver forms
function liveDevice(kind) {
  const test = { mopeka: d => d.kind === 'tank' && '/Mopeka/DistanceMm' in d.values,
                 esp32: d => (d.kind === 'tank' && '/Hydro/HeightMm' in d.values),
                 fridge: d => d.kind === 'temperature' && '/Fridge/PoweredOn' in d.values }[kind];
  return (S.state.devices || []).filter(test);
}

function control(f, value, secretSet, onchange) {
  const ro = !!f.readonly || !canEdit();
  let el;
  if (f.type === 'bool' || f.type === 'select') {
    const opts = (f.options || []);
    el = h('select', { disabled: ro }, h('option', { value: '' }, '(default)'),
      opts.map(o => h('option', { value: o[0] }, o[1])));
    el.value = value || '';
    if (value && el.value !== value) el.append(h('option', { value, selected: true }, value)), el.value = value;
  } else if (f.type === 'int' || f.type === 'float') {
    el = h('input', { type: 'number', inputmode: 'decimal', step: f.type === 'int' ? 1 : (f.step || 'any'),
      min: f.min, max: f.max, value: value, disabled: ro });
  } else if (f.type === 'secret') {
    el = h('input', { type: 'password', autocomplete: 'new-password', value: '', disabled: ro,
      placeholder: secretSet ? '(unchanged)' : '' });
  } else {
    el = h('input', { type: 'text', value: value, disabled: ro, autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
  }
  el.addEventListener('input', onchange);
  el.addEventListener('change', onchange);
  return el;
}

function fieldRow(form, f, section) {
  // a key missing from config.ini shows the value the driver uses then, so the form tells the truth
  const orig = section.values[f.key] || f.default || '';
  const err = h('div', { class: 'err' });
  const input = control(f, orig, (section.secret_set || {})[f.key], () => {
    input.classList.toggle('changed', input.value !== orig);
    input.classList.remove('bad'); clear(err);
    updateFormBar();
  });
  const chips = f.presets ? h('div', { class: 'row', style: 'margin-top:6px' }, f.presets.map(p =>
    h('button', { type: 'button', class: 'btn small', disabled: !canEdit(), onclick: () => { input.value = p; input.dispatchEvent(new Event('input')); } },
      p >= 60 && f.key === 'poll_interval' ? (p / 60) + ' min' : p))) : null;
  const box = h('div', { class: 'field' }, h('label', {}, f.label),
    f.unit ? h('div', { class: 'with-unit' }, input, h('span', { class: 'unit' }, f.unit)) : input,
    chips, f.help ? h('div', { class: 'help' }, f.help) : null, err);
  form.fields[f.key] = { input, orig, err, def: f };
  return box;
}

function formFor(section) {
  const form = { section, fields: {} };
  const normal = section.fields.filter(f => !f.advanced), adv = section.fields.filter(f => f.advanced);
  const card = h('div', { class: 'card' }, h('h3', {}, section.title, ' ', h('span', { class: 'muted' }, '[' + section.section + ']')));
  form.card = card;
  return { form, card, normal, adv };
}

function formChanges(form) {
  const out = {};
  for (const [k, f] of Object.entries(form.fields)) {
    if (f.def.readonly) continue;
    const v = f.input.value.trim();
    if (f.def.type === 'secret') { if (v !== '') out[k] = v; continue; }
    if (v !== f.orig) out[k] = v;
  }
  return out;
}

function updateFormBar() {
  const forms = Object.values(S.forms);
  const n = forms.reduce((a, fm) => a + Object.keys(formChanges(fm)).length, 0);
  if (!canEdit() || !n) { hideSaveBar(); return; }
  showSaveBar('forms', n, saveForms);
}

// The bar is built once per kind and only its counter changes afterwards: rebuilding it on every
// input would swap the button between mouse-down and mouse-up (a blur fires "change" first), and
// the tap on Save would be lost.
let barKind = null;
function showSaveBar(kind, count, onSave) {
  $('#savebar').hidden = false;
  if (barKind !== kind) {
    barKind = kind;
    clear($('#saveinner')).append(h('span', { id: 'savecount' }), h('span', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: () => renderTab() }, 'Discard'),
      h('button', { class: 'btn', onclick: () => onSave(false) }, 'Save'),
      h('button', { class: 'btn primary', onclick: () => onSave(true) }, 'Save & restart driver'));
  }
  $('#savecount').textContent = count + ' unsaved change' + (count > 1 ? 's' : '');
}
function hideSaveBar() { $('#savebar').hidden = true; barKind = null; }

async function saveForms(restart) {
  let allOk = true, lastMessage = '';
  for (const form of Object.values(S.forms)) {
    const changes = formChanges(form);
    if (!Object.keys(changes).length) continue;
    const body = { section: form.section.section, restart: restart ? '1' : '0' };
    for (const [k, v] of Object.entries(changes)) body['f.' + k] = v;
    const r = await api('/api/driver_config', body);
    if (!r.ok) {
      allOk = false;
      for (const [k, msg] of Object.entries(r.data.errors || {})) {
        const f = form.fields[k];
        if (f) { f.input.classList.add('bad'); clear(f.err).append(msg); }
      }
      toast(r.data.error || 'Not saved', true);
    } else lastMessage = r.data.message;
  }
  if (allOk) {
    toast(lastMessage || 'Saved');
    if (S.tab === 'water' || S.tab === 'gas' || S.tab === 'fridge') {
      const d = await api('/api/driver_config'); if (d.ok) S.driver = d.data;
      await refreshState(); await renderTab();
    }
  }
}

async function loadDriver() {
  const r = await api('/api/driver_config');
  if (r.ok) S.driver = r.data;
  return r;
}

async function tabDriver(kind) {
  const main = $('#main');
  S.forms = {};
  const live = liveDevice(kind);
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  const r = await loadDriver();
  if (!r.ok) { main.append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read config.ini')); return; }
  const sections = S.driver.sections.filter(s => s.kind === kind);
  if (!canEdit()) main.append(lockedNotice());
  if (!sections.length) {
    main.append(h('div', { class: 'banner' }, 'No [' + ({ fridge: 'fridge', mopeka: 'mopeka_standard', esp32: 'esp32_hydro', starlink: 'starlink' }[kind]) + '] section in config.ini yet. Add it on the Files & logs tab (see config.ini.example for a template).'));
    return;
  }
  for (const section of sections) {
    const { form, card, normal, adv } = formFor(section);
    S.forms[section.section] = form;
    // live panel with calibration helpers
    const dev = live.find(d => (d.service.split('.').pop() === (section.values.service || section.section))) || live[0];
    if (dev) card.append(livePanel(kind, dev, form));
    if (kind === 'mopeka' && section.presets.length) card.append(presetPicker(form, section));
    normal.forEach(f => card.append(fieldRow(form, f, section)));
    if (adv.length) card.append(h('details', { class: 'adv' }, h('summary', {}, 'Advanced'), adv.map(f => fieldRow(form, f, section))));
    if (kind === 'mopeka') card.append(h('div', { class: 'row' }, h('button', { class: 'btn small', disabled: !canEdit(), onclick: () =>
      confirmThen('Forget the paired sensor? Then press the sync button on the sensor you want to use.', () => post('/api/pair_reset', { section: section.section })) }, 'Pair another sensor')));
    if (kind === 'esp32') card.append(h('div', { class: 'muted' }, 'The height-to-litres table of the tank lives in the ESP32 itself (see docs/calibration.md); it is not part of this file.'));
    main.append(card);
  }
}

function livePanel(kind, dev, form) {
  const v = dev.values, box = h('div', { class: 'banner' });
  if (kind === 'mopeka') {
    const dist = v['/Mopeka/DistanceMm'];
    box.append(h('div', {}, h('b', {}, 'Now: '), num(v['/Level'], 0) + ' % · sensor reads ' + num(dist, 0) + ' mm · echo quality ' + (v['/Mopeka/EchoQuality'] ?? '–')),
      h('div', { class: 'muted' }, 'Calibrate: with an empty bottle press "Use as empty", right after a refill press "Use as full", then save.'),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { type: 'button', class: 'btn small', disabled: !canEdit() || dist == null, onclick: () => setField(form, 'empty_mm', Math.round(dist)) }, 'Use as empty (' + num(dist, 0) + ' mm)'),
        h('button', { type: 'button', class: 'btn small', disabled: !canEdit() || dist == null, onclick: () => setField(form, 'full_mm', Math.round(dist)) }, 'Use as full (' + num(dist, 0) + ' mm)')));
  } else if (kind === 'fridge') {
    box.append(h('b', {}, 'Now: '), num(v['/Temperature'], 1) + ' °C · set to ' + num(v['/Fridge/TargetTemperature'], 0) + ' °C · supply ' + num(v['/Fridge/SupplyVoltage'], 1) + ' V');
  } else {
    box.append(h('b', {}, 'Now: '), num(v['/Level'], 0) + ' % · ' + num(v['/Remaining'] * 1000, 1) + ' L · height ' + num(v['/Hydro/HeightMm'], 0) + ' mm');
  }
  return box;
}

function setField(form, key, value) {
  const f = form.fields[key]; if (!f) return;
  f.input.value = value; f.input.dispatchEvent(new Event('input'));
}

function presetPicker(form, section) {
  const sel = h('select', {}, h('option', { value: '' }, 'Choose a bottle…'),
    section.presets.map((p, i) => h('option', { value: i }, p.label)));
  sel.addEventListener('change', () => {
    if (sel.value === '') return;
    for (const [k, v] of Object.entries(section.presets[+sel.value].values)) setField(form, k, v);
    toast('Preset applied. Set "Reading when full" after the next refill, then save.');
  });
  return h('div', { class: 'field' }, h('label', {}, 'Bottle type'), sel, h('div', { class: 'help' }, 'Fills in volume and shape. You still calibrate empty/full once.'));
}

// -------------------------------------------------- dbus-serialbattery tab
const BMS_TYPES = ['Jkbms_Ble', 'Kilovault_Ble', 'LiTime_Ble', 'LltJbd_Ble', 'Xdzn_Ble'];

function sbEffective(e) { return e.value === null || e.value === undefined ? e.default : e.value; }

function sbControl(e, ro, onchange) {
  const v = sbEffective(e);
  let el, get = () => el.value, set = x => { el.value = x; };
  if (e.special === 'bms_list') return bmsList(e, v, ro, onchange);
  if (e.type === 'bool') {
    el = h('input', { type: 'checkbox', checked: v === 'True', disabled: ro });
    get = () => el.checked ? 'True' : 'False';
    set = x => { el.checked = x === 'True'; };
    const wrap = h('label', { class: 'switch' }, el, h('span', {}, ''));
    el.addEventListener('change', () => { wrap.lastChild.textContent = el.checked ? 'On' : 'Off'; onchange(); });
    wrap.lastChild.textContent = el.checked ? 'On' : 'Off';
    return { node: wrap, get, set };
  }
  if (e.type === 'select') {
    el = h('select', { disabled: ro }, (e.options || []).map(o => h('option', { value: o }, o))); el.value = v;
  } else if (e.type === 'int' || e.type === 'float') {
    el = h('input', { type: 'number', step: e.type === 'int' ? 1 : 'any', inputmode: 'decimal', value: v, disabled: ro });
  } else if (e.secret) {
    el = h('input', { type: 'password', autocomplete: 'new-password', value: '', disabled: ro, placeholder: e.has_value ? '(unchanged)' : '' });
  } else {
    el = h('input', { type: 'text', value: v, disabled: ro, autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
  }
  el.addEventListener('input', onchange); el.addEventListener('change', onchange);
  return { node: el, get, set };
}

function bmsList(e, v, ro, onchange) {
  const box = h('div', {}), rows = h('div', {});
  const parse = text => text.split(',').map(s => s.trim()).filter(Boolean).map(s => { const p = s.split(/\s+/); return [p[0] || BMS_TYPES[0], p[1] || '']; });
  const addRow = (type, mac) => {
    const sel = h('select', { disabled: ro, style: 'max-width:200px' }, (BMS_TYPES.includes(type) ? BMS_TYPES : BMS_TYPES.concat([type])).map(t => h('option', { value: t }, t)));
    sel.value = type;
    const inp = h('input', { type: 'text', value: mac, disabled: ro, placeholder: 'AA:BB:CC:DD:EE:FF', style: 'max-width:220px', autocapitalize: 'characters', spellcheck: 'false' });
    const row = h('div', { class: 'row', style: 'margin-bottom:6px' }, sel, inp,
      h('button', { type: 'button', class: 'btn small', disabled: ro, onclick: () => { row.remove(); onchange(); } }, 'Remove'));
    sel.addEventListener('change', onchange); inp.addEventListener('input', onchange);
    rows.append(row);
  };
  parse(v).forEach(([t, m]) => addRow(t, m));
  box.append(rows, h('button', { type: 'button', class: 'btn small', disabled: ro, onclick: () => { addRow(BMS_TYPES[0], ''); onchange(); } }, 'Add a BMS'));
  const get = () => Array.from(rows.children).map(r => r.querySelector('select').value + ' ' + r.querySelector('input').value.trim()).filter(s => s.split(' ')[1]).join(', ');
  const set = x => { clear(rows); parse(x).forEach(([t, m]) => addRow(t, m)); };
  return { node: box, get, set };
}

function sameSb(e, a, b) {
  a = (a || '').trim(); b = (b || '').trim();
  if (e.type === 'int' || e.type === 'float') return a !== '' && b !== '' ? Number(a) === Number(b) : a === b;
  if (e.type === 'numlist') return a.split(',').map(x => x.trim()).join(',') === b.split(',').map(x => x.trim()).join(',');
  if (e.type === 'bool') return a.toLowerCase() === b.toLowerCase();
  return a === b;
}

function sbChanges() {
  const out = {};
  for (const [k, c] of Object.entries(S.sbCtl)) {
    const now = c.get();
    if (c.entry.secret) { if (now !== '') out[k] = now; continue; }
    if (!sameSb(c.entry, now, c.orig)) out[k] = now;
  }
  return out;
}

function updateSbBar() {
  const n = Object.keys(sbChanges()).length;
  for (const c of Object.values(S.sbCtl)) {
    const changed = c.entry.secret ? c.get() !== '' : !sameSb(c.entry, c.get(), c.orig);
    c.row.classList.toggle('modified', changed || (c.entry.value !== null && c.entry.value !== undefined));
    c.reset.hidden = sameSb(c.entry, c.get(), c.entry.default) || c.entry.secret;
    c.row.dataset.changed = changed ? '1' : '';
  }
  if (!canEdit() || !n) { hideSaveBar(); return; }
  showSaveBar('sb', n, saveSb);
}

async function saveSb(restart) {
  const body = { restart: restart ? '1' : '0' };
  for (const [k, v] of Object.entries(sbChanges())) body['s.' + k] = v;
  const r = await api('/api/serialbattery', body);
  if (!r.ok) {
    for (const [k, msg] of Object.entries(r.data.errors || {})) {
      const c = S.sbCtl[k]; if (c) { c.err.textContent = msg; c.row.scrollIntoView({ block: 'center' }); }
    }
    toast(r.data.error || 'Not saved', true); return;
  }
  toast(r.data.message || 'Saved');
  await renderTab();
  if (r.data.reboot_needed) {
    $('#main').prepend(h('div', { class: 'banner warn row' }, 'Saved. Bluetooth/CAN settings only apply after a reboot of the Pi.',
      h('span', { class: 'spacer' }), h('button', { class: 'btn danger small', onclick: () => confirmThen('Reboot the Pi now?', () => post('/api/reboot', {})) }, 'Reboot now')));
  }
}

function sbEntry(e, ro) {
  const err = h('div', { class: 'err' });
  const row = h('div', { class: 'entry', 'data-key': e.key });
  const ctl = sbControl(e, ro, () => { err.textContent = ''; updateSbBar(); });
  const reset = h('button', { type: 'button', class: 'link', hidden: true, onclick: () => { ctl.set(e.default); updateSbBar(); } }, 'Reset to default');
  const help = e.help ? h('pre', { hidden: true }, e.help) : null;
  const more = e.help ? h('button', { type: 'button', class: 'link', onclick: () => { help.hidden = !help.hidden; more.textContent = help.hidden ? 'About this setting' : 'Hide'; } }, 'About this setting') : null;
  row.append(h('div', { class: 'top' }, h('span', { class: 'name' }, e.label), h('code', {}, e.key)), ctl.node,
    h('div', { class: 'meta' }, h('span', {}, 'Default: ' + (e.secret ? '–' : (e.default === '' ? '(empty)' : e.default))), reset, more), help, err);
  S.sbCtl[e.key] = { entry: e, get: ctl.get, set: ctl.set, orig: sbEffective(e), row, reset, err };
  return row;
}

async function tabBatterySettings(main) {
  S.sbCtl = {};
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  const r = await api('/api/serialbattery');
  if (!r.ok) { main.append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the settings')); return; }
  S.sb = r.data;
  if (!r.data.installed) {
    main.append(h('div', { class: 'banner' }, 'dbus-serialbattery was not found in /data/apps/dbus-serialbattery. Install it first (see mr-manuel/venus-os_dbus-serialbattery).'));
    return;
  }
  const ro = !canEdit();
  if (ro) main.append(lockedNotice());
  const view = r.data.view, byKey = {};
  view.groups.forEach(g => g.entries.forEach(e => { byKey[e.key] = e; }));
  const search = h('input', { type: 'search', placeholder: 'Search settings…', style: 'max-width:340px' });
  const onlyMod = h('input', { type: 'checkbox' });
  main.append(h('div', { class: 'row', style: 'margin-bottom:12px' }, search,
    h('label', { class: 'row muted' }, onlyMod, ' only changed'),
    h('span', { class: 'spacer' }), h('span', { class: 'muted' }, r.data.dir + '/config.ini')));
  const groups = [];
  const addGroup = (title, entries, open) => {
    const body = h('div', { class: 'body' }, entries.map(e => sbEntry(e, ro)));
    const det = h('details', { class: 'group', open }, h('summary', {}, title, ' ', h('span', { class: 'muted' }, '(' + entries.length + ')')), body);
    groups.push({ det, entries });
    main.append(det);
  };
  addGroup('Most used settings', view.essentials.map(k => byKey[k]), true);
  const essential = new Set(view.essentials);
  view.groups.forEach(g => {
    const rest = g.entries.filter(e => !essential.has(e.key));
    if (rest.length) addGroup(g.title, rest, false);
  });
  const filter = () => {
    const q = search.value.trim().toLowerCase();
    groups.forEach(g => {
      let shown = 0;
      g.entries.forEach(e => {
        const c = S.sbCtl[e.key], text = (e.key + ' ' + e.label + ' ' + e.help).toLowerCase();
        const mod = c.row.classList.contains('modified');
        const ok = (!q || text.includes(q)) && (!onlyMod.checked || mod);
        c.row.hidden = !ok; if (ok) shown++;
      });
      g.det.hidden = !shown;
      if (q && shown) g.det.open = true;
    });
  };
  search.addEventListener('input', filter); onlyMod.addEventListener('change', filter);
  if (S.sbSearch) { search.value = S.sbSearch; S.sbSearch = ''; filter(); }
  if (Object.keys(view.unknown || {}).length) {
    main.append(h('div', { class: 'banner' }, 'Settings in config.ini this page does not know (kept as they are): ' + Object.keys(view.unknown).join(', ')));
  }
  updateSbBar();
}

// ------------------------------------------------- battery: drawing helpers
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const cellColor = (i, n) => 'hsl(' + Math.round(i * 360 / Math.max(n, 1)) + ',65%,50%)';

function niceTicks(lo, hi, count) {
  if (!(hi > lo)) hi = lo + 1;
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw - 1e-12);
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  const dec = Number.isInteger(+step.toFixed(8)) ? 0 : Math.max(1, Math.ceil(-Math.log10(step)));
  return { ticks: out, dec };
}

// draws into `box` at its real width, again whenever the width changes
function sized(box, draw) {
  let last = 0;
  const go = () => { const w = Math.floor(box.clientWidth); if (w > 40 && w !== last) { last = w; draw(w); } };
  new ResizeObserver(go).observe(box);
  return go;
}

const clock = (t, withSeconds) => {
  const d = new Date(t * 1000), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + (withSeconds ? ':' + p(d.getSeconds()) : '');
};

// A time chart. o = { title, t, series:[{id,name,color,vals,dash}], unit, dec, area, include:[], lines:[{y,label,color}], height }
function timeChart(o) {
  S.hidden = S.hidden || {};
  const hidden = S.hidden[o.title] = S.hidden[o.title] || {};
  const box = h('div', { class: 'chart' }), legend = h('div', { class: 'legend' }), holder = h('div', {});
  const tip = h('div', { class: 'tt', hidden: true });
  const shown = () => o.series.filter(s => !hidden[s.id]);
  if (o.series.length > 1) {
    o.series.forEach(s => {
      const b = h('button', { type: 'button', class: hidden[s.id] ? 'off' : '', onclick: () => { hidden[s.id] = !hidden[s.id]; b.className = hidden[s.id] ? 'off' : ''; redraw(); } },
        h('i', { style: 'background:' + s.color }), s.name);
      legend.append(b);
    });
  }
  box.append(h('h3', { style: 'margin:0 0 4px' }, o.title, o.badge || null, o.note ? h('span', { class: 'muted', style: 'font-weight:400;text-transform:none;letter-spacing:0' }, ' ' + o.note) : null), legend, holder, tip);
  let width = 0;
  const H = o.height || 190, L = 48, R = 10, T = 8, B = 22;
  function redraw() {
    if (!width) return;
    clear(holder);
    const t = o.t, vis = shown();
    const root = svg('svg', { width, height: H, viewBox: '0 0 ' + width + ' ' + H });
    holder.append(root);
    if (t.length < 2) { root.append(svg('text', { x: width / 2, y: H / 2, 'text-anchor': 'middle' }, 'Collecting data… (one point every ' + (S.bInterval || 10) + ' s)')); return; }
    let lo = Infinity, hi = -Infinity;
    for (const s of vis) for (const v of s.vals) if (v !== null && v !== undefined) { if (v < lo) lo = v; if (v > hi) hi = v; }
    for (const v of (o.include || [])) { if (v < lo) lo = v; if (v > hi) hi = v; }
    if (!isFinite(lo)) { root.append(svg('text', { x: width / 2, y: H / 2, 'text-anchor': 'middle' }, 'no data')); return; }
    const pad = (hi - lo) * 0.1 || (Math.abs(hi) * 0.02) || 1;
    if (o.min !== undefined) lo = o.min; else lo -= pad;
    if (o.max !== undefined) hi = o.max; else hi += pad;
    const yt = niceTicks(lo, hi, 4);
    const t0 = t[0], t1 = t[t.length - 1], span = Math.max(1, t1 - t0);
    const X = x => L + (x - t0) / span * (width - L - R), Y = y => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
    const grid = svg('g', { class: 'grid' });
    yt.ticks.forEach(v => { grid.append(svg('line', { x1: L, x2: width - R, y1: Y(v), y2: Y(v) })); root.append(svg('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }, v.toFixed(yt.dec))); });
    root.prepend(grid);
    const nx = width < 420 ? 3 : 5;
    for (let k = 0; k <= nx; k++) {
      const tt = t0 + span * k / nx;
      root.append(svg('text', { x: X(tt), y: H - 6, 'text-anchor': k === 0 ? 'start' : (k === nx ? 'end' : 'middle') }, clock(tt, span < 600)));
    }
    for (const ln of (o.lines || [])) {
      if (ln.y < lo || ln.y > hi) continue;
      root.append(svg('line', { x1: L, x2: width - R, y1: Y(ln.y), y2: Y(ln.y), stroke: ln.color || 'var(--warn)', 'stroke-dasharray': '5 4', 'stroke-width': 1 }),
        svg('text', { x: width - R - 2, y: Y(ln.y) - 3, 'text-anchor': 'end', style: 'fill:' + (ln.color || 'var(--warn)') }, ln.label));
    }
    if (o.zero !== false && lo < 0 && hi > 0) root.append(svg('line', { x1: L, x2: width - R, y1: Y(0), y2: Y(0), stroke: 'var(--muted)', 'stroke-width': 1 }));
    for (const s of vis) {
      let d = '', pen = false, first = null, lastx = null;
      s.vals.forEach((v, i) => {
        if (v === null || v === undefined) { pen = false; return; }
        d += (pen ? 'L' : 'M') + X(t[i]).toFixed(1) + ' ' + Y(v).toFixed(1);
        pen = true; if (first === null) first = X(t[i]); lastx = X(t[i]);
      });
      if (!d) continue;
      if ((s.area || (o.area && vis.length === 1)) && first !== null) root.append(svg('path', { d: d + 'L' + lastx.toFixed(1) + ' ' + Y(Math.max(lo, Math.min(hi, 0))).toFixed(1) + 'L' + first.toFixed(1) + ' ' + Y(Math.max(lo, Math.min(hi, 0))).toFixed(1) + 'Z', fill: s.color, opacity: 0.10 }));
      root.append(svg('path', { d, fill: 'none', stroke: s.color, 'stroke-width': s.w || 1.6, 'stroke-linejoin': 'round', 'stroke-dasharray': s.dash || null }));
    }
    const cursor = svg('line', { y1: T, y2: H - B, stroke: 'var(--muted)', 'stroke-width': 1, visibility: 'hidden' });
    const overlay = svg('rect', { x: L, y: T, width: width - L - R, height: H - T - B, fill: 'transparent', style: 'touch-action:pan-y' });
    root.append(cursor, overlay);
    const move = ev => {
      const r = root.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const target = t0 + (px - L) / (width - L - R) * span;
      let best = 0; for (let i = 1; i < t.length; i++) if (Math.abs(t[i] - target) < Math.abs(t[best] - target)) best = i;
      cursor.setAttribute('x1', X(t[best])); cursor.setAttribute('x2', X(t[best])); cursor.setAttribute('visibility', 'visible');
      clear(tip).hidden = false;
      tip.append(h('b', {}, clock(t[best], true)));
      const rows = vis.filter(s => s.vals[best] !== null && s.vals[best] !== undefined);
      (rows.length > 12 ? rows.slice().sort((a, b) => a.vals[best] - b.vals[best]).filter((s, i, arr) => i < 3 || i >= arr.length - 3) : rows).forEach(s =>
        tip.append(h('div', {}, h('i', { style: 'display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:' + s.color }), s.name + ': ' + s.vals[best].toFixed(o.dec === undefined ? yt.dec : o.dec) + (o.unit ? ' ' + o.unit : ''))));
      const left = X(t[best]) + 12 + tip.offsetWidth > width ? X(t[best]) - 12 - tip.offsetWidth : X(t[best]) + 12;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = (T + 24) + 'px';
    };
    const leave = () => { cursor.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    overlay.addEventListener('pointermove', move); overlay.addEventListener('pointerleave', leave);
    overlay.addEventListener('touchstart', move, { passive: true }); overlay.addEventListener('touchmove', move, { passive: true });
    overlay.addEventListener('touchend', leave);
  }
  sized(box, w => { width = w; redraw(); });
  return box;
}

function ring(pct, color) {
  const r = 38, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
  return svg('svg', { width: 96, height: 96, viewBox: '0 0 96 96' },
    svg('circle', { cx: 48, cy: 48, r, fill: 'none', stroke: 'var(--soft)', 'stroke-width': 10 }),
    svg('circle', { cx: 48, cy: 48, r, fill: 'none', stroke: color, 'stroke-width': 10, 'stroke-linecap': 'round',
      'stroke-dasharray': (c * p / 100).toFixed(1) + ' ' + c.toFixed(1), transform: 'rotate(-90 48 48)' }),
    svg('text', { x: 48, y: 54, 'text-anchor': 'middle', style: 'font-size:20px;font-weight:700;fill:var(--ink)' }, pct == null ? '–' : Math.round(pct) + '%'));
}

// bars of the cell voltages: the axis starts near the lowest cell, so small differences are visible
function cellBars(cells, bal) {
  const box = h('div', { class: 'chart' });
  const known = cells.filter(c => c !== null);
  const draw = width => {
    clear(box);
    const n = cells.length, H = 210, L = 44, R = 8, T = 22, B = 30;
    const mn = Math.min(...known), mx = Math.max(...known), avg = known.reduce((a, b) => a + b, 0) / known.length;
    const pad = Math.max(0.01, (mx - mn) * 0.6);
    const lo = Math.floor((mn - pad) * 100) / 100, hi = Math.ceil((mx + pad) * 100) / 100;
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B), root = svg('svg', { width, height: H, viewBox: '0 0 ' + width + ' ' + H });
    const yt = niceTicks(lo, hi, 4), grid = svg('g', { class: 'grid' });
    yt.ticks.forEach(v => { grid.append(svg('line', { x1: L, x2: width - R, y1: Y(v), y2: Y(v) })); root.append(svg('text', { x: L - 5, y: Y(v) + 4, 'text-anchor': 'end' }, v.toFixed(yt.dec))); });
    root.prepend(grid);
    const slot = (width - L - R) / n, bw = Math.min(46, slot * 0.72);
    cells.forEach((v, i) => {
      const x = L + slot * i + (slot - bw) / 2;
      if (v === null) { root.append(svg('text', { x: x + bw / 2, y: H - B - 4, 'text-anchor': 'middle' }, '?')); }
      else {
        const color = v === mx && mx !== mn ? 'var(--accent)' : (v === mn && mx !== mn ? 'var(--warn)' : 'var(--accent)');
        root.append(svg('rect', { x, y: Y(v), width: bw, height: Math.max(1, H - B - Y(v)), rx: 3, fill: color, opacity: v === mx || v === mn ? 1 : 0.5 }));
        const rotate = bw < 34, lx = x + bw / 2, ly = Y(v) - 4;
        root.append(svg('text', { x: lx, y: ly, 'text-anchor': rotate ? 'start' : 'middle', transform: rotate ? 'rotate(-90 ' + lx + ' ' + ly + ')' : null,
          style: 'font-size:' + (rotate ? 10 : 11) + 'px;fill:var(--ink)' }, v.toFixed(3)));
        if (bal && bal[i]) root.append(svg('circle', { cx: x + bw / 2, cy: H - B + 20, r: 3.5, fill: 'var(--warn)' }));
      }
      root.append(svg('text', { x: x + bw / 2, y: H - B + 13, 'text-anchor': 'middle' }, i + 1));
    });
    root.append(svg('line', { x1: L, x2: width - R, y1: Y(avg), y2: Y(avg), stroke: 'var(--muted)', 'stroke-dasharray': '4 4' }),
      svg('text', { x: width - R, y: Y(avg) - 3, 'text-anchor': 'end' }, 'average ' + avg.toFixed(3) + ' V'));
    box.append(root, h('div', { class: 'muted' }, 'Axis starts at ' + lo.toFixed(2) + ' V, so small differences look bigger. ',
      h('span', { style: 'color:var(--accent)' }, '■ highest '), h('span', { style: 'color:var(--warn)' }, '■ lowest '),
      bal && bal.some(Boolean) ? h('span', { style: 'color:var(--warn)' }, '● balancing') : null));
  };
  sized(box, draw);
  return box;
}

// ------------------------------------------------------ battery: the page
const BAT_WINDOWS = [[900, '15 min'], [3600, '1 hour'], [21600, '6 hours']];
function stopBattery() { clearInterval(S.bTimer); S.bTimer = null; clearInterval(S.slTimer); S.slTimer = null; clearInterval(S.rawTimer); S.rawTimer = null; }

async function tabBattery(main) {
  stopBattery();
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  S.sbView = S.sbView || 'live';
  const views = [['live', 'Live & cells'], ['limits', 'Limits & curves'], ['settings', 'All settings']];
  main.append(h('div', { class: 'pills', role: 'group' }, views.map(([id, label]) =>
    h('button', { type: 'button', 'aria-pressed': S.sbView === id, onclick: () => { S.sbView = id; renderTab(); } }, label))));
  const box = h('div', {});
  main.append(box);
  if (S.sbView === 'settings') return tabBatterySettings(box);
  if (S.sbView === 'limits') return tabBatteryLimits(box);
  await liveView(box);
  S.bTimer = setInterval(() => {
    if (document.hidden || S.tab !== 'battery' || S.sbView !== 'live' || $('#dlg').open) return;
    liveView(box);
  }, 10000);
}

const pretty = s => s.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/_/g, ' ');
const lastOf = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null && arr[i] !== undefined) return arr[i]; return null; };

async function liveView(box) {
  const q = '/api/battery?window=' + (S.bWindow || 3600) + (S.bService ? '&service=' + encodeURIComponent(S.bService) : '');
  const r = await api(q);
  if (S.tab !== 'battery' || S.sbView !== 'live') return;
  const out = h('div', {});
  if (!r.ok) { out.append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the battery data')); clear(box).append(out); return; }
  const d = r.data;
  S.bInterval = d.interval;
  if (!d.service) {
    out.append(h('div', { class: 'banner warn' }, 'No battery found on the Pi. Is dbus-serialbattery running and connected to the BMS? On the Pi: ',
      h('code', {}, 'svstat /service/dbus-serialbattery.*'), ' and look at its log on the Files & logs tab. This page starts recording a minute after a battery shows up.'));
    clear(box).append(out); return;
  }
  S.bService = d.service;
  const hist = d.history, info = d.info, V = p => info.values[p];
  const controls = h('div', { class: 'row', style: 'margin-bottom:12px' },
    d.batteries.length > 1 ? h('select', { style: 'max-width:260px', onchange: ev => { S.bService = ev.target.value; liveView(box); } },
      d.batteries.map(b => h('option', { value: b.service, selected: b.service === d.service }, b.name + ' (' + b.service.split('.').pop() + ')'))) : h('b', {}, d.batteries[0].name),
    h('span', { class: 'spacer' }),
    BAT_WINDOWS.map(([sec, label]) => h('button', { type: 'button', class: 'btn small' + (S.bWindow === sec || (!S.bWindow && sec === 3600) ? ' primary' : ''), onclick: () => { S.bWindow = sec; liveView(box); } }, label)));
  out.append(controls);
  if (info.age > 60) out.append(h('div', { class: 'banner warn' }, 'The last reading is ' + ago(info.age) + ' old. The driver may have lost the BMS.'));

  const cellsNow = hist.cells.map(c => lastOf(c)), balNow = hist.bal.map(c => lastOf(c));
  const known = cellsNow.filter(c => c !== null);
  out.append(h('div', { class: 'tiles' },
    h('div', { class: 'tile' }, h('div', { class: 'k' }, 'Charge'), h('div', { style: 'display:flex;justify-content:center' }, ring(V('/Soc'), 'var(--ok)'))),
    tile('Voltage', num(V('/Dc/0/Voltage'), 2), 'V', known.length ? known.length + ' cells, avg ' + (known.reduce((a, b) => a + b, 0) / known.length).toFixed(3) + ' V' : ''),
    tile('Current', num(V('/Dc/0/Current'), 1), 'A', V('/Dc/0/Current') > 0.3 ? 'charging' : (V('/Dc/0/Current') < -0.3 ? 'discharging' : 'idle')),
    tile('Power', num(V('/Dc/0/Power'), 0), 'W', ''),
    tile('Battery temp', num(V('/Dc/0/Temperature'), 1), '°C', ['/System/Temperature1', '/System/Temperature2', '/System/Temperature3', '/System/Temperature4'].map(p => V(p)).filter(x => x != null && x > -50).map(x => x.toFixed(1)).join(' / ')),
    tile('MOSFET temp', num(V('/System/MOSTemperature'), 1), '°C', ''),
    tile('Cell spread', known.length > 1 ? ((Math.max(...known) - Math.min(...known)) * 1000).toFixed(0) : '–', 'mV', known.length > 1 ? 'lowest ' + Math.min(...known).toFixed(3) + ' · highest ' + Math.max(...known).toFixed(3) : 'no cell data'),
    tile('BMS allows', '', '', '', [['charge', V('/Io/AllowToCharge')], ['discharge', V('/Io/AllowToDischarge')], ['balance', V('/Io/AllowToBalance')]].filter(x => x[1] != null)
      .map(([n, on]) => h('span', { class: 'chip ' + (on ? 'pill-on' : 'pill-off'), style: 'margin:2px 4px 0 0' }, n + (on ? ' ✓' : ' ✗'))))));

  const tbl = hist.cells.length ? cellTable(hist, cellsNow, balNow) : null;      // also fills S.cellStats
  out.append(findingsCard(info, hist, cellsNow, balNow));

  if (known.length) {
    out.append(h('div', { class: 'card' }, h('h3', {}, 'Cells right now'), cellBars(cellsNow, balNow)));
  } else {
    out.append(h('div', { class: 'banner' }, 'No per-cell voltages published. Turn them on under All settings → BATTERY_CELL_DATA_FORMAT = 1 (or 3), then restart the driver.'));
  }

  const t = hist.t, s = hist.series, charts = [];
  if (s.i) charts.push(timeChart({ title: 'Current', unit: 'A', t, area: true, dec: 1, note: '(+ charging, − discharging)', series: [{ id: 'i', name: 'Current', color: 'var(--ink)', vals: s.i }] }));
  if (s.soc) charts.push(timeChart({ title: 'State of charge', unit: '%', t, min: Math.max(0, Math.min(...s.soc.filter(x => x != null)) - 5), max: 100, dec: 0, series: [{ id: 'soc', name: 'SOC', color: 'var(--ok)', vals: s.soc }] }));
  if (s.v) charts.push(timeChart({ title: 'Pack voltage', unit: 'V', t, dec: 2, series: [{ id: 'v', name: 'Voltage', color: 'var(--ink)', vals: s.v }] }));
  if (s.diff) charts.push(timeChart({ title: 'Cell spread (highest − lowest)', unit: 'mV', t, dec: 0, min: 0, include: [30], lines: [{ y: 30, label: '30 mV' }], series: [{ id: 'diff', name: 'Spread', color: 'var(--warn)', vals: s.diff }] }));
  if (charts.length) out.append(h('div', { class: 'two' }, charts.map(c => h('div', { class: 'card' }, c))));

  const nc = hist.cells.length;
  if (nc) {
    const cellSeries = hist.cells.map((vals, i) => ({ id: 'c' + i, name: 'Cell ' + (i + 1), color: cellColor(i, nc), vals, w: 1.3 }));
    const avgAt = hist.t.map((_, k) => { const xs = hist.cells.map(c => c[k]).filter(x => x != null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; });
    const devSeries = hist.cells.map((vals, i) => ({ id: 'c' + i, name: 'Cell ' + (i + 1), color: cellColor(i, nc), w: 1.3,
      vals: vals.map((x, k) => x == null || avgAt[k] == null ? null : (x - avgAt[k]) * 1000) }));
    out.append(h('div', { class: 'card' }, timeChart({ title: 'Cell voltages', unit: 'V', t, dec: 3, height: 240, note: '(tap a cell in the legend to hide it)', series: cellSeries })));
    out.append(h('div', { class: 'card' }, timeChart({ title: 'Cell difference from the average', unit: 'mV', t, dec: 1, height: 220, note: '(a cell that stays far from 0 is the odd one out)', series: devSeries })));
    out.append(tbl);
  }
  const temps = [['temp', 'Battery', 'var(--ink)'], ['t1', 'Probe 1', '#c8c8c8'], ['t2', 'Probe 2', '#8f8f8f'], ['t3', 'Probe 3', 'var(--warn)'], ['t4', 'Probe 4', '#ff8a3d'], ['mos', 'MOSFET', 'var(--ok)']]
    .filter(([k]) => s[k]).map(([k, name, color]) => ({ id: k, name, color, vals: s[k] }));
  const lim = [['ccl', 'Charge limit (A)', 'var(--ok)'], ['dcl', 'Discharge limit (A)', 'var(--bad)']].filter(([k]) => s[k]).map(([k, name, color]) => ({ id: k, name, color, vals: s[k] }));
  const more = [];
  if (temps.length) more.push(timeChart({ title: 'Temperatures', unit: '°C', t, dec: 1, series: temps }));
  if (lim.length) more.push(timeChart({ title: 'Current the BMS allows', unit: 'A', t, dec: 0, min: 0, series: lim }));
  if (more.length) out.append(h('div', { class: 'two' }, more.map(c => h('div', { class: 'card' }, c))));

  const rows = Object.entries(info.values).sort((a, b) => a[0] < b[0] ? -1 : 1);
  out.append(h('details', { class: 'group', open: S.openAll, ontoggle: ev => { S.openAll = ev.target.open; } }, h('summary', {}, 'All values from the BMS ', h('span', { class: 'muted' }, '(' + rows.length + ')')),
    h('div', { class: 'body' }, h('table', { class: 'kv' }, rows.map(([k, v]) => h('tr', {}, h('td', {}, h('code', {}, k)), h('td', {}, typeof v === 'number' ? String(Math.round(v * 1000) / 1000) : String(v))))))));
  out.append(h('div', { class: 'muted', style: 'margin-top:8px' }, 'The Pi records a point every ' + d.interval + ' s and keeps up to 6 hours in memory (since ' + clock(info.since, false) + ', restarting the settings page starts it over). Updates every 10 s.'));
  clear(box).append(out);
}

function tile(k, v, unit, sub, extra) {
  return h('div', { class: 'tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v, unit ? h('small', {}, ' ' + unit) : null), sub ? h('div', { class: 's' }, sub) : null, extra || null);
}

function cellTable(hist, cellsNow, balNow) {
  const n = hist.cells.length, lowCount = new Array(n).fill(0), highCount = new Array(n).fill(0), devSum = new Array(n).fill(0), samples = [];
  hist.t.forEach((_, k) => {
    const row = hist.cells.map(c => c[k]), ok = row.filter(x => x != null);
    if (ok.length < 2) return;
    const mn = Math.min(...ok), mx = Math.max(...ok), avg = ok.reduce((a, b) => a + b, 0) / ok.length;
    samples.push(k);
    row.forEach((x, i) => { if (x == null) return; devSum[i] += x - avg; if (x === mn && mx - mn >= 0.003) lowCount[i]++; if (x === mx && mx - mn >= 0.003) highCount[i]++; });
  });
  const total = samples.length || 1;
  S.cellStats = { lowCount, highCount, devSum, total };
  const rows = hist.cells.map((c, i) => {
    const vals = c.filter(x => x != null), dev = devSum[i] / total * 1000;
    return h('tr', {}, h('td', {}, 'Cell ' + (i + 1)), h('td', {}, cellsNow[i] === null ? '–' : cellsNow[i].toFixed(3) + ' V'),
      h('td', {}, vals.length ? Math.min(...vals).toFixed(3) + ' – ' + Math.max(...vals).toFixed(3) : '–'),
      h('td', { style: Math.abs(dev) > 15 ? 'color:var(--warn);font-weight:600' : '' }, (dev > 0 ? '+' : '') + dev.toFixed(1) + ' mV'),
      h('td', {}, Math.round(lowCount[i] / total * 100) + ' %'), h('td', {}, Math.round(highCount[i] / total * 100) + ' %'),
      h('td', {}, balNow[i] ? h('span', { class: 'chip warn' }, 'balancing') : ''));
  });
  return h('details', { class: 'group', open: S.openCells !== false, ontoggle: ev => { S.openCells = ev.target.open; } }, h('summary', {}, 'Cell table for this period'),
    h('div', { class: 'body', style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, ['Cell', 'Now', 'Range', 'Avg vs others', 'Lowest', 'Highest', ''].map(x => h('th', {}, x)))), h('tbody', {}, rows))));
}

function findingsCard(info, hist, cellsNow, balNow) {
  const items = [], V = p => info.values[p];
  const add = (level, text) => items.push({ level, text });
  const known = cellsNow.filter(c => c !== null);
  const alarms = Object.entries(info.values).filter(([k, v]) => k.startsWith('/Alarms/') && typeof v === 'number' && v > 0);
  alarms.forEach(([k, v]) => add(v >= 2 ? 'bad' : 'warn', 'BMS ' + (v >= 2 ? 'alarm' : 'warning') + ': ' + pretty(k.replace('/Alarms/', ''))));
  if (info.age > 60) add('warn', 'No fresh reading for ' + ago(info.age) + '.');
  if (known.length > 1) {
    const mn = Math.min(...known), mx = Math.max(...known), diff = (mx - mn) * 1000;
    if (mx >= 3.40) add(diff <= 20 ? 'ok' : (diff <= 50 ? 'warn' : 'bad'), 'Cells are ' + (diff <= 20 ? 'well balanced' : (diff <= 50 ? 'a bit apart' : 'far apart')) + ' near full: ' + diff.toFixed(0) + ' mV between the best and worst cell.' + (diff > 20 ? ' Charge to full and keep it there for some hours so the balancer can work.' : ''));
    else add(diff <= 60 ? 'ok' : 'warn', 'Spread is ' + diff.toFixed(0) + ' mV. It only says something near full (cells above 3.40 V); in the middle of the range LiFePO4 cells are naturally further apart.');
    if (mx > 3.65) add('bad', 'A cell is at ' + mx.toFixed(3) + ' V, above the 3.65 V a LiFePO4 cell may reach.');
    if (mn < 2.8) add('bad', 'A cell is at ' + mn.toFixed(3) + ' V, below 2.8 V (LiFePO4).');
    const st = S.cellStats;
    if (st && st.total >= 5) {
      const worst = st.lowCount.indexOf(Math.max(...st.lowCount)), share = st.lowCount[worst] / st.total, dev = st.devSum[worst] / st.total * 1000;
      if (share >= 0.6 && dev < -10) add('warn', 'Cell ' + (worst + 1) + ' is the lowest cell ' + Math.round(share * 100) + ' % of the time (' + dev.toFixed(0) + ' mV under the average). Watch it: it may be weaker or have a poor connection.');
      const best = st.highCount.indexOf(Math.max(...st.highCount)), bshare = st.highCount[best] / st.total, bdev = st.devSum[best] / st.total * 1000;
      if (bshare >= 0.6 && bdev > 10) add('warn', 'Cell ' + (best + 1) + ' is the highest cell ' + Math.round(bshare * 100) + ' % of the time (+' + bdev.toFixed(0) + ' mV over the average). It hits the charge limit first.');
    }
  }
  const bal = balNow.map((b, i) => b ? i + 1 : null).filter(x => x);
  if (bal.length) add('ok', 'Balancing cell' + (bal.length > 1 ? 's ' : ' ') + bal.join(', ') + ' right now.');
  const temps = ['/System/Temperature1', '/System/Temperature2', '/System/Temperature3', '/System/Temperature4', '/Dc/0/Temperature'].map(p => V(p)).filter(x => x != null && x > -50);
  if (temps.length > 1 && Math.max(...temps) - Math.min(...temps) > 5) add('warn', 'Temperature probes differ by ' + (Math.max(...temps) - Math.min(...temps)).toFixed(1) + ' °C.');
  if (V('/System/MOSTemperature') != null && V('/System/MOSTemperature') > 60) add(V('/System/MOSTemperature') > 80 ? 'bad' : 'warn', 'The MOSFETs are at ' + V('/System/MOSTemperature').toFixed(0) + ' °C.');
  if (temps.length && Math.min(...temps) < 5 && V('/Io/AllowToCharge') !== 0 && (V('/Dc/0/Current') || 0) > 0) add('warn', 'Charging at ' + Math.min(...temps).toFixed(0) + ' °C: LiFePO4 should not be charged below 0 °C.');
  const ccl = V('/Info/MaxChargeCurrent'), dcl = V('/Info/MaxDischargeCurrent'), cclMax = Math.max(...(hist.series.ccl || [0]).filter(x => x != null), 0);
  if (ccl === 0) add('warn', 'Charging is currently blocked (charge current limit is 0 A).');
  else if (ccl != null && cclMax > 0 && ccl < cclMax * 0.9) add('warn', 'Charge current is limited to ' + ccl.toFixed(0) + ' A (it was up to ' + cclMax.toFixed(0) + ' A). That is normal near full or when cold; see Limits & curves.');
  if (dcl === 0) add('warn', 'Discharging is currently blocked (discharge current limit is 0 A).');
  if (!items.length) add('ok', 'Nothing unusual.');
  else if (!items.some(i => i.level !== 'ok')) add('ok', 'No problems found.');
  return h('div', { class: 'card' }, h('h3', {}, 'What I notice'), items.map(i => h('div', { class: 'find' }, h('span', { class: 'dot ' + i.level }), h('div', {}, i.text))));
}

const parseList = text => String(text || '').split(',').map(x => parseFloat(x)).filter(x => !isNaN(x));
const truthy = v => ['true', 'yes', '1', 'on'].includes(String(v).trim().toLowerCase());

function lerp(points, x) {
  if (!points.length) return null;
  if (x <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) if (x <= points[i][0]) {
    const [x0, y0] = points[i - 1], [x1, y1] = points[i];
    return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return points[points.length - 1][1];
}

// current limit against a measurement; the driver interpolates between the points
function curveChart(o) {
  const box = h('div', { class: 'chart' });
  const pts = o.xs.map((x, i) => [x, o.ys[i] * o.max]).sort((a, b) => a[0] - b[0]);
  sized(box, width => {
    clear(box);
    const H = 170, L = 40, R = 12, T = 12, B = 34;
    const xs = pts.map(p => p[0]), pad = (Math.max(...xs) - Math.min(...xs)) * 0.12 || 1;
    let lo = Math.min(...xs) - pad, hi = Math.max(...xs) + pad;
    if (o.live != null) { lo = Math.min(lo, o.live - pad / 2); hi = Math.max(hi, o.live + pad / 2); }
    const ymax = Math.max(o.max, ...pts.map(p => p[1])) * 1.1 || 1;
    const X = x => L + (x - lo) / (hi - lo) * (width - L - R), Y = y => T + (1 - y / ymax) * (H - T - B);
    const root = svg('svg', { width, height: H, viewBox: '0 0 ' + width + ' ' + H, style: o.off ? 'opacity:.45' : '' });
    const yt = niceTicks(0, ymax, 3), xt = niceTicks(lo, hi, width < 420 ? 4 : 6), grid = svg('g', { class: 'grid' });
    yt.ticks.forEach(v => { grid.append(svg('line', { x1: L, x2: width - R, y1: Y(v), y2: Y(v) })); root.append(svg('text', { x: L - 5, y: Y(v) + 4, 'text-anchor': 'end' }, v.toFixed(yt.dec))); });
    xt.ticks.forEach(v => root.append(svg('text', { x: X(v), y: H - B + 14, 'text-anchor': 'middle' }, v.toFixed(xt.dec))));
    root.prepend(grid);
    const line = [[lo, lerp(pts, lo)], ...pts, [hi, lerp(pts, hi)]];
    root.append(svg('path', { d: line.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(''), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }));
    pts.forEach(p => root.append(svg('circle', { cx: X(p[0]), cy: Y(p[1]), r: 3.5, fill: 'var(--accent)' })));
    root.append(svg('text', { x: (L + width - R) / 2, y: H - 4, 'text-anchor': 'middle' }, o.xlabel));
    if (o.live != null) {
      const now = lerp(pts, o.live);
      root.append(svg('line', { x1: X(o.live), x2: X(o.live), y1: T, y2: H - B, stroke: 'var(--warn)', 'stroke-dasharray': '4 3', 'stroke-width': 1.5 }),
        svg('circle', { cx: X(o.live), cy: Y(now), r: 4.5, fill: 'var(--warn)' }));
    }
    box.append(root);
  });
  return box;
}

function voltageWindow(eff, live, cells) {
  const marks = [['MIN_CELL_VOLTAGE', 'empty (min)', 'var(--bad)'], ['FLOAT_CELL_VOLTAGE', 'float', 'var(--ok)'], ['MAX_CELL_VOLTAGE', 'full (max)', 'var(--accent)'], ['SOC_RESET_CELL_VOLTAGE', 'SOC reset', 'var(--warn)']]
    .map(([k, label, color]) => ({ k, label, color, v: parseFloat(eff(k)) })).filter(m => !isNaN(m.v)).sort((a, b) => a.v - b.v);
  const box = h('div', { class: 'gauge' });
  if (!marks.length) return box;
  sized(box, width => {
    clear(box);
    const L = 14, R = 14, lo = Math.min(2.6, marks[0].v - 0.1), hi = Math.max(3.75, marks[marks.length - 1].v + 0.1), X = v => L + (v - lo) / (hi - lo) * (width - L - R);
    const LH = cells ? 38 : 26, gap = 92;
    const slots = [{ up: true, row: 0, last: -999 }, { up: false, row: 0, last: -999 }, { up: true, row: 1, last: -999 }, { up: false, row: 1, last: -999 }];
    const placed = marks.map(m => { const x = X(m.v), sl = slots.find(sl => x - sl.last >= gap) || slots[0]; sl.last = x; return { m, x, sl }; });
    const upRows = Math.max(0, ...placed.filter(p => p.sl.up).map(p => p.sl.row + 1)), downRows = Math.max(0, ...placed.filter(p => !p.sl.up).map(p => p.sl.row + 1));
    const y = 12 + upRows * LH + 6, hgt = 16, H = y + hgt + 12 + downRows * LH;

    root.append(svg('rect', { x: L, y, width: width - L - R, height: hgt, rx: 8, fill: 'var(--soft)' }));
    if (mn && mx) root.append(svg('rect', { x: X(mn.v), y, width: Math.max(2, X(mx.v) - X(mn.v)), height: hgt, fill: 'var(--ok)', opacity: 0.28 }));
    if (live && live.min != null && live.max != null) root.append(svg('rect', { x: X(live.min), y: y - 4, width: Math.max(3, X(live.max) - X(live.min)), height: hgt + 8, rx: 4, fill: 'none', stroke: 'var(--warn)', 'stroke-width': 2 }));
    placed.forEach(({ m, x, sl }) => {
      root.append(svg('line', { x1: x, x2: x, y1: sl.up ? y - 4 - sl.row * LH : y, y2: sl.up ? y + hgt : y + hgt + 6 + sl.row * LH, stroke: m.color, 'stroke-width': sl.row ? 1 : 3, opacity: sl.row ? 0.5 : 1 }));
      const ty = sl.up ? y - 10 - sl.row * LH - (cells ? 26 : 14) : y + hgt + 18 + sl.row * LH;
      const anchor = x < 56 ? 'start' : (x > width - 56 ? 'end' : 'middle');
      const lines = [[m.label, 'fill:' + m.color + ';font-weight:600'], [m.v.toFixed(3) + ' V per cell', 'fill:var(--ink)']];
      if (cells) lines.push([(m.v * cells).toFixed(1) + ' V pack', 'fill:var(--muted)']);
      lines.forEach(([txt, st], k) => root.append(svg('text', { x, y: ty + k * 12, 'text-anchor': anchor, style: st }, txt)));
    });
    box.append(root);
  });
  return box;
}
