    if (adv.length) card.append(h('details', { class: 'adv' }, h('summary', {}, 'Advanced'), adv.map(x => fieldRow(f, x, section))));
    card.append(h('div', { class: 'muted' }, 'A change is applied when this page restarts ("Save & restart driver").'));
    form.append(card);
  } else {
    form.append(h('div', { class: 'muted' }, 'Using the defaults (dish at 192.168.100.1, every 5 s). To change them add a [starlink] section to config.ini on the Files & logs tab (see config.ini.example).'));
  }
}

async function starlinkView(box) {
  const r = await api('/api/starlink?window=' + (S.slWindow || 3600));
  if (S.tab !== 'starlink') return;
  const out = h('div', {});
  if (!r.ok) { clear(box).append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the Starlink data')); return; }
  const d = r.data, st = d.status;
  if (!d.enabled) {
    out.append(h('div', { class: 'banner' }, 'Reading the dish is switched off ([starlink] enabled = no).'));
    clear(box).append(out); return;
  }
  if (!st) {
    out.append(h('div', { class: 'banner warn' }, 'No answer from the dish at ' + d.host + (d.error ? ' (' + d.error + ')' : '') + '. Check on the Pi: ',
      h('code', {}, 'curl -s -m 5 -o /dev/null -w "%{http_code}" http://' + d.host + '/'), '. The Pi has to be on the same network as the dish (the Starlink router, or a router that passes 192.168.100.1 through).'));
    clear(box).append(out); return;
  }
  const controls = h('div', { class: 'row', style: 'margin-bottom:12px' }, h('b', {}, 'Starlink'), h('span', { class: 'spacer' }),
    [[900, '15 min'], [3600, '1 hour'], [7200, '2 hours']].map(([sec, label]) => h('button', { type: 'button', class: 'btn small' + ((S.slWindow || 3600) === sec ? ' primary' : ''), onclick: () => { S.slWindow = sec; starlinkView(box); } }, label)));
  out.append(controls);
  if (d.age > 30 || d.error) out.append(h('div', { class: 'banner warn' }, 'The last reading is ' + ago(d.age) + ' old' + (d.error ? ' (' + d.error + ')' : '') + '.'));

  const good = st.state === 'Connected', hs = d.history.series, win = (S.slWindow || 3600) >= 3600 ? (S.slWindow || 3600) / 3600 + ' h' : '15 min';
  const avg = (k, dec) => { const a = (hs[k] || []).filter(x => x != null); return a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(dec) : '–'; };
  const metric = (label, value, unit, sub) => h('div', { class: 'metric' }, h('div', { class: 'label' }, label),
    h('div', { class: 'num' }, value, h('small', {}, unit)), h('div', { class: 'sub' }, sub));
  out.append(h('div', { class: 'hero' },
    metric('Downlink', fmtMbps(st.down_bps), 'Mbps', 'average ' + avg('down_mbps', 0) + ' Mbps over ' + win),
    metric('Uplink', fmtMbps(st.up_bps), 'Mbps', 'average ' + avg('up_mbps', 1) + ' Mbps over ' + win),
    metric('PoP latency', st.latency_ms == null ? '–' : st.latency_ms.toFixed(0), 'ms', 'average ' + avg('latency_ms', 0) + ' ms over ' + win)));
  const alerts = st.alerts || [];
  out.append(h('div', { class: 'row', style: 'margin:0 0 8px' }, h('span', { class: 'chip ' + (good ? 'ok' : 'bad') }, st.state),
    alerts.length ? alerts.map(a => h('span', { class: 'chip ' + (INFO_ALERT.includes(a) ? '' : 'warn') }, a)) : h('span', { class: 'chip' }, 'no alerts')));
  out.append(h('div', { class: 'metaline' }, h('span', {}, 'Uptime ', h('b', {}, fmtDuration(st.uptime_s))),
    h('span', {}, 'GPS ', h('b', {}, st.gps_sats == null ? '–' : st.gps_sats + ' sats')),
    h('span', {}, 'Ethernet ', h('b', {}, st.eth_mbps == null ? '–' : st.eth_mbps + ' Mbps')),
    h('span', {}, 'Obstruction ', h('b', {}, st.obstructed_pct == null ? '–' : st.obstructed_pct.toFixed(1) + ' %')),
    st.tilt == null ? null : h('span', {}, 'Tilt ', h('b', {}, st.tilt.toFixed(0) + '°')),
    h('span', {}, 'Firmware ', h('b', {}, st.software || '–'))));

  const t = d.history.t, s = hs, charts = [];
  const live = h('span', { class: 'live' }, 'LIVE');
  if (s.down_mbps || s.up_mbps) out.append(h('div', { class: 'card' }, timeChart({ title: 'Live throughput', badge: live, unit: 'Mbps', t, dec: 1, min: 0,
    series: [s.down_mbps && { id: 'down', name: 'Download', color: 'var(--ink)', vals: s.down_mbps, area: true }, s.up_mbps && { id: 'up', name: 'Upload', color: 'var(--muted)', vals: s.up_mbps }].filter(Boolean) })));
  if (s.latency_ms) charts.push(timeChart({ title: 'PoP latency', unit: 'ms', t, dec: 0, min: 0, series: [{ id: 'lat', name: 'PoP latency', color: 'var(--ink)', vals: s.latency_ms }] }));
  if (s.drop_pct) charts.push(timeChart({ title: 'Drop rate', unit: '%', t, dec: 1, min: 0, series: [{ id: 'drop', name: 'Drop rate', color: 'var(--bad)', vals: s.drop_pct }] }));
  if (s.obstructed_pct) charts.push(timeChart({ title: 'Obstruction', unit: '%', t, dec: 1, min: 0, series: [{ id: 'obs', name: 'Obstructed', color: 'var(--warn)', vals: s.obstructed_pct }] }));
  if (charts.length) out.append(h('div', { class: 'two' }, charts.map(c => h('div', { class: 'card' }, c))));

  const items = [], add = (level, text) => items.push({ level, text });
  if (st.outage) add('bad', 'Outage: ' + st.outage.cause + (st.outage.seconds ? ' (' + Math.round(st.outage.seconds) + ' s so far)' : '') + '.');
  if (st.obstructed_pct != null && st.obstructed_pct > 10) add('bad', 'The dish sees ' + st.obstructed_pct.toFixed(0) + ' % obstruction. Trees, a roof edge or the van itself are in the way.');
  else if (st.obstructed_pct != null && st.obstructed_pct > 3) add('warn', 'About ' + st.obstructed_pct.toFixed(1) + ' % of the sky is blocked. A few percent is normal; short dropouts come from this.');
  if (st.drop_rate != null && st.drop_rate > 0.01) add('warn', 'Packet loss is ' + (st.drop_rate * 100).toFixed(1) + ' %.');
  if (st.latency_ms != null && st.latency_ms > 100) add('warn', 'Ping to Starlink is high (' + st.latency_ms.toFixed(0) + ' ms).');
  alerts.forEach(a => add(INFO_ALERT.includes(a) ? 'ok' : 'warn', 'Dish says: ' + a + '.'));
  if (st.update && !['idle', 'disabled', 'unknown'].includes(st.update)) add('ok', 'Software update: ' + st.update + '.');
  if (!items.length) add('ok', 'Nothing unusual.');
  out.append(h('div', { class: 'card' }, h('h3', {}, 'What I notice'), items.map(i => h('div', { class: 'find' }, h('span', { class: 'dot ' + i.level }), h('div', {}, i.text)))));

  const stat = (k, v, sub, small) => h('div', { class: 'stat' }, h('div', { class: 'k' }, k), h('div', { class: 'v', style: small ? 'font-size:1rem' : '' }, v), sub ? h('div', { class: 's' }, sub) : null);
  out.append(h('h2', {}, 'Dish statistics'), h('div', { class: 'stats' },
    stat('State', st.state), stat('Uptime', fmtDuration(st.uptime_s)),
    stat('Obstructed', st.obstructed_pct == null ? '–' : st.obstructed_pct.toFixed(2) + ' %', st.currently_obstructed ? 'right now' : ''),
    stat('Drop rate', st.drop_rate == null ? '–' : (st.drop_rate * 100).toFixed(2) + ' %'),
    stat('GPS', st.gps_sats == null ? '–' : st.gps_sats + ' satellites', st.gps_valid === false ? 'no fix' : ''),
    stat('Ethernet', st.eth_mbps == null ? '–' : st.eth_mbps + ' Mbps'),
    st.azimuth == null ? null : stat('Azimuth', st.azimuth.toFixed(0) + '°'), st.elevation == null ? null : stat('Elevation', st.elevation.toFixed(0) + '°'),
    st.tilt == null ? null : stat('Tilt', st.tilt.toFixed(1) + '°'),
    stat('Software', st.software || '–', '', true), stat('Hardware', st.hardware || '–', st.generation == null ? '' : 'generation ' + st.generation, true),
    stat('Dish ID', st.id || '–', '', true), st.update ? stat('Update', st.update, '', true) : null,
    st.ready ? stat('Ready', Object.entries(st.ready).map(([k, v]) => k + (v ? ' ✓' : ' ✗')).join(' '), '', true) : null,
    stat('Read via', d.via || '–', d.host, true)));
  out.append(h('div', { class: 'muted', style: 'margin-top:8px' }, 'Read every ' + d.interval + ' s from the dish. Starlink does not publish this interface, so a dish update can change what is shown. History is kept in memory for 2 hours.'));
  clear(box).append(out);
}

function starlinkCard(sl) {
  if (!sl || !sl.enabled || !sl.state) return null;
  const good = sl.state === 'Connected';
  return h('div', { class: 'card' }, h('h3', {}, 'Starlink ', h('span', { class: 'chip ' + (good ? 'ok' : 'bad') }, sl.state)),
    h('div', { class: 'big' }, fmtMbps(sl.down_bps), h('small', {}, ' Mbit/s down')),
    h('div', { class: 'muted' }, 'up ' + fmtMbps(sl.up_bps) + ' · ping ' + (sl.latency_ms == null ? '–' : sl.latency_ms.toFixed(0)) + ' ms · obstructed ' + (sl.obstructed_pct == null ? '–' : sl.obstructed_pct.toFixed(1)) + ' %'),
    (sl.alerts || []).length ? h('div', { class: 'muted' }, sl.alerts.join(', ')) : null);
}

// ------------------------------------------------------------- raw data
const RAW_SOURCES = [['gas', 'Gas (Mopeka)'], ['fridge', 'Fridge'], ['water', 'Water (ESP32)']];
const FRIDGE_BYTES = { 0: 'locked', 1: 'power on', 2: 'eco mode', 3: 'battery saver', 4: 'left set point', 5: 'left highest set point',
  6: 'left lowest set point', 9: 'unit (0 °C, 1 °F)', 14: 'left temperature', 15: 'battery % (127 = none)', 16: 'supply volts', 17: 'supply volts, tenths',
  18: 'right set point', 19: 'right highest set point', 20: 'right lowest set point', 26: 'right temperature', 27: 'running status', 28: 'model' };

async function tabRaw(main) {
  stopBattery();
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  S.rawSource = S.rawSource || 'gas';
  main.append(h('div', { class: 'pills', role: 'group' }, RAW_SOURCES.map(([id, label]) =>
    h('button', { type: 'button', 'aria-pressed': S.rawSource === id, onclick: () => { S.rawSource = id; renderTab(); } }, label))));
  const box = h('div', {});
  main.append(box);
  await rawView(box);
  S.rawTimer = setInterval(() => { if (!document.hidden && S.tab === 'raw' && !S.rawPaused && !$('#dlg').open) rawView(box); }, 3000);
}

function rawLine(text) {
  const m = /^(\S+ \S+) (\S+)\s+(.*)$/.exec(text);
  if (!m) return h('div', {}, text);
  return h('div', {}, h('span', { class: 'ts' }, m[1].slice(11) + ' '), h('span', { class: 'k k-' + m[2] }, m[2].padEnd(6)), ' ', m[3]);
}

async function rawView(box) {
  const r = await api('/api/rawlog?source=' + S.rawSource + '&lines=300');
  if (S.tab !== 'raw') return;
  const out = h('div', {});
  if (!r.ok) { clear(box).append(h('div', { class: 'banner bad' }, r.data.error || 'Could not read the log')); return; }
  const lines = r.data.lines, old = $('.rawbox'), stick = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 30;
  const note = { gas: 'Every Mopeka advertisement of your sensor: the raw bytes (data=), what they decode to, and the level that was published.',
    fridge: 'What the Pi sends to the fridge (tx) and what comes back (rx), with the decoded status. A status payload is a row of bytes; the table below names them.',
    water: 'Every new ESP32 advertisement with its raw bytes and what they decode to.' }[S.rawSource];
  out.append(h('div', { class: 'row', style: 'margin-bottom:8px' }, h('div', { class: 'muted' }, note), h('span', { class: 'spacer' }),
    h('button', { type: 'button', class: 'btn small', onclick: () => { S.rawPaused = !S.rawPaused; renderTab(); } }, S.rawPaused ? 'Resume' : 'Pause'),
    h('button', { type: 'button', class: 'btn small', onclick: () => copyText(lines.join('\n')) }, 'Copy'),
    h('button', { type: 'button', class: 'btn small danger', disabled: !canEdit(), onclick: async () => { await api('/api/rawlog_clear', { source: S.rawSource }); rawView(box); } }, 'Clear')));
  const view = h('div', { class: 'rawbox' }, lines.length ? lines.map(rawLine) : h('div', { class: 'muted' }, 'Nothing logged yet. The log lives in ' + r.data.dir + ' on the Pi (lost at a reboot) and fills as the sensor sends data. Update the drivers and restart them if it stays empty.'));
  out.append(view);
  if (S.rawSource === 'fridge') {
    const last = lines.slice().reverse().map(l => /payload=([0-9a-f]+)/.exec(l)).find(Boolean);
    if (last) {
      const bytes = last[1].match(/../g).map(x => parseInt(x, 16));
      out.append(h('details', { class: 'group', open: true, style: 'margin-top:12px' }, h('summary', {}, 'Last status payload, byte by byte'),
        h('div', { class: 'body', style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, ['Byte', 'Hex', 'Value', 'Meaning'].map(x => h('th', {}, x)))),
          h('tbody', {}, bytes.map((b, i) => h('tr', {}, h('td', {}, i), h('td', {}, h('code', {}, b.toString(16).padStart(2, '0'))), h('td', {}, b > 127 ? b + ' (' + (b - 256) + ')' : b), h('td', {}, FRIDGE_BYTES[i] || ''))))))));
    }
  }
  clear(box).append(out);
  const nv = $('.rawbox');
  if (nv && stick) nv.scrollTop = nv.scrollHeight;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); return; } catch (e) { /* plain http: not allowed */ }
  const ta = h('textarea', { style: 'position:fixed;left:-1000px' }, text);
  document.body.append(ta); ta.value = text; ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
  ta.remove();
  toast(ok ? 'Copied' : 'Copy is blocked here: press and hold the text to select it', !ok);
}

// ------------------------------------------------------------ files & logs
async function rawEditor(which, title) {
  const r = await api('/api/raw?file=' + which);
  const card = h('div', { class: 'card' }, h('h3', {}, title));
  if (!r.ok) { card.append(h('div', { class: 'muted' }, r.data.error || 'not available')); return card; }
  const ta = h('textarea', { spellcheck: 'false', disabled: !canEdit() }, r.data.text);
  const errs = h('div', { class: 'err' });
  ta.value = r.data.text;
  ta.addEventListener('input', () => ta.classList.toggle('changed', ta.value !== r.data.text));
  card.append(h('div', { class: 'muted' }, r.data.path + ' (the previous version is kept as .bak)'), ta, errs,
    h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn primary', disabled: !canEdit(), onclick: async () => {
      const w = await api('/api/raw', { file: which, text: ta.value });
      clear(errs);
      if (!w.ok) { errs.append(w.data.error || 'Not saved', ...Object.entries(w.data.errors || {}).map(([k, m]) => h('div', {}, k + ': ' + m))); toast('Not saved', true); }
      else { toast('Saved. Restart the driver to apply it.'); r.data.text = ta.value; ta.classList.remove('changed'); }
    } }, 'Save file')));
  return card;
}

async function tabFiles(main) {
  if (!canEdit() && S.state.password_set) { main.append(lockedNotice()); return; }
  main.append(h('div', { class: 'banner' }, 'For experts: the raw files. A file is checked before it is saved; a wrong value is refused.'));
  main.append(await rawEditor('driver', 'Drivers: config.ini'));
  if (S.state.serialbattery) main.append(await rawEditor('serialbattery', 'dbus-serialbattery: config.ini'));
  main.append(h('h2', {}, 'Logs'));
  main.append(h('div', { class: 'row' }, (S.state.services || []).map(s => h('button', { class: 'btn small', onclick: () => showLog(s.name) }, s.name)),
    S.state.serialbattery ? h('button', { class: 'btn small', onclick: () => showLog('dbus-serialbattery') }, 'dbus-serialbattery') : null));
}

// ------------------------------------------------------------------- boot
async function refreshState() {
  const r = await api('/api/state');
  if (r.ok) { S.state = r.data; renderLock(); }
  return r;
}

async function boot() {
  renderTabs();
  const r = await refreshState();
  if (!r.ok) { $('#main').append(h('div', { class: 'banner bad' }, r.data.error || 'The Pi does not answer')); return; }
  await renderTab();
  setInterval(async () => {
    if (document.hidden) return;
    await refreshState();
    if (S.tab === 'overview' && !$('#dlg').open) { const main = clear($('#main')); await tabOverview(main); }
  }, 5000);
}
boot();
</script>
